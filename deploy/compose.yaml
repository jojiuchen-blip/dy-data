name: ${COMPOSE_PROJECT_NAME:-dy-dashboard}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dy_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-dy_dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    image: ${API_IMAGE:-dy-dashboard-api:local}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://dy_dashboard:CHANGE_ME_POSTGRES_PASSWORD@postgres:5432/dy_dashboard}
      DY_SUPER_ADMIN_USERNAME: ${DY_SUPER_ADMIN_USERNAME:-}
      DY_SUPER_ADMIN_PASSWORD_HASH: ${DY_SUPER_ADMIN_PASSWORD_HASH:-}
      DY_ADMIN_USERNAME: ${DY_ADMIN_USERNAME:-}
      DY_ADMIN_PASSWORD_HASH: ${DY_ADMIN_PASSWORD_HASH:-}
      DY_SESSION_SECRET: ${DY_SESSION_SECRET:-CHANGE_ME_SESSION_SECRET}
      DY_SESSION_COOKIE_SECURE: ${DY_SESSION_COOKIE_SECURE:-true}
      DY_WEB_BASE_URL: ${DY_WEB_BASE_URL:?DY_WEB_BASE_URL is required}
      DY_AGENT_ENVIRONMENT: ${DY_AGENT_ENVIRONMENT:-production}
      TZ: Asia/Shanghai
    expose:
      - "8000"
    mem_limit: ${API_MEMORY_LIMIT:-768m}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - app

  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    image: ${API_IMAGE:-dy-dashboard-api:local}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://dy_dashboard:CHANGE_ME_POSTGRES_PASSWORD@postgres:5432/dy_dashboard}
      TZ: Asia/Shanghai
    networks:
      - app

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    image: ${WORKER_IMAGE:-dy-dashboard-worker:local}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      browser:
        condition: service_started
    command: ["sh", "-c", "exec ${WORKER_COMMAND:-python -m apps.worker.scheduler}"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://dy_dashboard:CHANGE_ME_POSTGRES_PASSWORD@postgres:5432/dy_dashboard}
      DOUYIN_APP_ID: ${DOUYIN_APP_ID:-CHANGE_ME_DOUYIN_APP_ID}
      DOUYIN_APP_SECRET: ${DOUYIN_APP_SECRET:-CHANGE_ME_DOUYIN_APP_SECRET}
      DOUYIN_ACCOUNT_ID: ${DOUYIN_ACCOUNT_ID:-CHANGE_ME_DOUYIN_ACCOUNT_ID}
      WORKER_MODE: ${WORKER_MODE:-collect_and_settle}
      WORKER_MATERIALIZATION_STAGE_TIMEOUT_SECONDS: ${WORKER_MATERIALIZATION_STAGE_TIMEOUT_SECONDS:-7200}
      DOUYIN_COLLECT_START: ${DOUYIN_COLLECT_START:-2026-01-01}
      DOUYIN_COLLECT_OVERLAP_DAYS: ${DOUYIN_COLLECT_OVERLAP_DAYS:-7}
      DOUYIN_VERIFY_CHUNK_DAYS: ${DOUYIN_VERIFY_CHUNK_DAYS:-7}
      BROWSER_CDP_URL: ${BROWSER_CDP_URL:-http://browser:9222}
      BROWSER_EXPORT_DOWNLOAD_DIR: ${BROWSER_EXPORT_DOWNLOAD_DIR:-/home/browser/Downloads/job-runs}
      BROWSER_EXPORT_ARTIFACT_DIR: ${BROWSER_EXPORT_ARTIFACT_DIR:-/data/browser-exports}
      BROWSER_EXPORT_COMMAND: ${BROWSER_EXPORT_COMMAND:-python -m apps.worker.browser_exports.backend_aweme}
      BROWSER_EXPORT_ACTIVE_FILE: /run/browser/browser-export.active
      BACKEND_AWEME_EXPORT_URL: ${BACKEND_AWEME_EXPORT_URL:-https://life.douyin.com/}
      WORKER_RESOURCE_GUARD_ENABLED: ${WORKER_RESOURCE_GUARD_ENABLED:-true}
      WORKER_RESOURCE_WARN_HOST_USED_BYTES: ${WORKER_RESOURCE_WARN_HOST_USED_BYTES:-6442450944}
      WORKER_RESOURCE_STOP_HOST_USED_BYTES: ${WORKER_RESOURCE_STOP_HOST_USED_BYTES:-6871947673}
      WORKER_RESOURCE_MAX_PROCESS_TREE_RSS_BYTES: ${WORKER_RESOURCE_MAX_PROCESS_TREE_RSS_BYTES:-2147483648}
      WORKER_RESOURCE_MAX_CGROUP_CURRENT_BYTES: ${WORKER_RESOURCE_MAX_CGROUP_CURRENT_BYTES:-3221225472}
      WORKER_RESOURCE_MAX_SWAP_USED_BYTES: ${WORKER_RESOURCE_MAX_SWAP_USED_BYTES:-0}
      TZ: Asia/Shanghai
    volumes:
      - browser-downloads:/home/browser/Downloads
      - browser-runtime:/run/browser
      - exports-data:/data
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-5m}
    mem_limit: ${WORKER_MEMORY_LIMIT:-3g}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - app

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    image: ${WEB_IMAGE:-dy-dashboard-web:local}
    restart: unless-stopped
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://api:8000}
    expose:
      - "80"
    networks:
      - app

  browser:
    build:
      context: ..
      dockerfile: deploy/browser/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    image: ${BROWSER_IMAGE:-dy-dashboard-browser:local}
    restart: unless-stopped
    shm_size: "2gb"
    environment:
      VNC_PASSWORD: ${BROWSER_VNC_PASSWORD:-CHANGE_ME_BROWSER_VNC_PASSWORD}
      CHROMIUM_START_URL: ${CHROMIUM_START_URL:-https://life.douyin.com/}
      SCREEN_WIDTH: ${BROWSER_SCREEN_WIDTH:-1440}
      SCREEN_HEIGHT: ${BROWSER_SCREEN_HEIGHT:-1000}
      TZ: Asia/Shanghai
    volumes:
      - browser-profile:/home/browser/.config/chromium
      - browser-downloads:/home/browser/Downloads
      - browser-runtime:/run/browser
    expose:
      - "6080"
      - "9222"
    mem_limit: ${BROWSER_MEMORY_LIMIT:-2g}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 9223), 2).close()"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - app

  ops-agent:
    build:
      context: ..
      dockerfile: apps/ops_agent/Dockerfile
    image: ${OPS_AGENT_IMAGE:-dy-dashboard-ops-agent:local}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      browser:
        condition: service_healthy
    environment:
      OPS_AGENT_DATABASE_URL: ${OPS_AGENT_DATABASE_URL:?OPS_AGENT_DATABASE_URL is required}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-dy-dashboard}
      OPS_AGENT_ALLOWED_TARGETS: worker,browser
      OPS_AGENT_ALLOWED_ACTIONS: restart
      OPS_AGENT_COMMAND_TTL_SECONDS: 120
      OPS_AGENT_COOLDOWN_SECONDS: ${OPS_AGENT_COOLDOWN_SECONDS:-300}
      OPS_AGENT_DOCKER_SOCKET: /var/run/docker.sock
      BROWSER_EXPORT_ACTIVE_FILE: /run/browser/browser-export.active
      TZ: Asia/Shanghai
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - browser-runtime:/run/browser:ro
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: ${OPS_AGENT_MEMORY_LIMIT:-256m}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; p='/tmp/ops-agent.healthy'; assert os.path.exists(p) and time.time()-os.path.getmtime(p) < 30"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - app

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
      browser:
        condition: service_started
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  postgres-data:
  browser-profile:
  browser-downloads:
  browser-runtime:
  exports-data:
