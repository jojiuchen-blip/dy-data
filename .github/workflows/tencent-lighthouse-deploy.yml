name: Tencent Lighthouse Deploy

# Isolated operational ref. Cleans unused builder cache only; validates
# unchanged containers, rollback image tags and volume inventory.
# Does not deploy or write application/database/backup data.

"on":
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: tencent-lighthouse-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    name: DYDATA-102/103 scoped dangling build cache maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_SSH_PORT: ${{ vars.TENCENT_SSH_PORT }}
      TENCENT_SSH_USER: ${{ vars.TENCENT_SSH_USER }}
      TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
      TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
    steps:
      - name: Check required settings
        run: |
          for name in TENCENT_HOST TENCENT_SSH_USER TENCENT_SSH_KEY TENCENT_KNOWN_HOSTS; do
            [ -n "${!name}" ] || { echo "::error::$name is not configured"; exit 1; }
          done
      # The pinned host key is mandatory: StrictHostKeyChecking keeps its secure
      # default and a mismatch fails the job instead of being accepted.
      - name: Configure SSH with pinned host key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent_lighthouse
          chmod 600 ~/.ssh/tencent_lighthouse
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$TENCENT_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || { echo "::error::pinned host key does not cover TENCENT_HOST"; exit 1; }
      - name: Collect masked read-only evidence
        run: |
          ssh -i ~/.ssh/tencent_lighthouse -p "${TENCENT_SSH_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=5 \
            "$TENCENT_SSH_USER@$TENCENT_HOST" 'bash -s' <<'REMOTE' > "$RUNNER_TEMP/report.txt"
          set -euo pipefail
          cd /opt/dy-dashboard/repo
          sudo docker compose --env-file /opt/dy-dashboard/env/production.env -f deploy/compose.yaml exec -T api python - <<'PY'
          import json,re
          from sqlalchemy import select,text,func
          from datetime import datetime
          from dy_api import models as M
          from dy_api.pdca_readonly_access import _open_pdca_readonly_session
          gen=_open_pdca_readonly_session();session=next(gen)
          try:
              assert session.scalar(text('SHOW transaction_read_only'))=='on'
              start=datetime.fromisoformat('2026-09-01T00:00:00+08:00');end=datetime.fromisoformat('2026-10-01T00:00:00+08:00')
              children=session.scalars(select(M.JobRun).where(M.JobRun.parent_job_id=='range-sync-cfd16d14060472e3243b03244fd65322')).all()
              out={'children':[{'job_id':j.job_id,'kind':j.job_kind,'status':j.status,'error_code':j.error_code} for j in children],'error_summaries':[re.sub(r'https?://\S+|postgres\S+|[0-9]{8,}','[masked]',line)[:350] for j in children for line in (j.error_message or '').splitlines() if line.startswith('ValueError:')]}
              root=session.get(M.JobRun,'range-sync-10562f3369ac7d31e9801d42d8db1d60')
              entries=(root.metadata_json or {}).get('recovery_generations',[]) if root else []
              out['root_recovery_ledger']=[{k:e.get(k) for k in ('parent_job_id','ordinal','config_version')} for e in entries]
              out['root_status']=root.status if root else None
              out['september_source_counts']={
                  'raw_orders_by_pay_time':session.scalar(select(func.count()).select_from(M.RawDouyinOrder).where(M.RawDouyinOrder.pay_time>=start,M.RawDouyinOrder.pay_time<end)),
                  'raw_verify_events_including_cancellations':session.scalar(select(func.count()).select_from(M.RawDouyinVerifyRecord).where(M.RawDouyinVerifyRecord.verify_time>=start,M.RawDouyinVerifyRecord.verify_time<end)),
                  'materialized_verified_coupons':session.scalar(select(func.count()).select_from(M.SettlementOrderDetail).where(M.SettlementOrderDetail.is_verified.is_(True),M.SettlementOrderDetail.verify_time>=start,M.SettlementOrderDetail.verify_time<end)),
                  'current_fee_results':session.scalar(select(func.count()).select_from(M.SettlementFeeResult).join(M.SettlementFeeResultCurrent,M.SettlementFeeResultCurrent.fee_result_id==M.SettlementFeeResult.fee_result_id).where(M.SettlementFeeResult.original_business_month=='2026-09')),
                  'current_statements':session.scalar(select(func.count()).select_from(M.SettlementStatement).where(M.SettlementStatement.statement_month=='2026-09',M.SettlementStatement.is_current.is_(True)))
              }
              out['monthly_scope_rule_counts']=[{'month':month,'active':active,'rows':rows} for month,active,rows in session.execute(select(M.SettlementScopeRule.effective_month,M.SettlementScopeRule.is_active,func.count()).where(M.SettlementScopeRule.effective_month.in_(['2026-08','2026-09','2026-10'])).group_by(M.SettlementScopeRule.effective_month,M.SettlementScopeRule.is_active))]
              out['september_blocker_counts']=[{'type':kind,'rows':rows} for kind,rows in session.execute(select(M.DataQualityIssue.issue_type,func.count()).join(M.SettlementOrderDetail,M.SettlementOrderDetail.coupon_id==M.DataQualityIssue.coupon_id).where(M.SettlementOrderDetail.is_verified.is_(True),M.SettlementOrderDetail.verify_time>=start,M.SettlementOrderDetail.verify_time<end).group_by(M.DataQualityIssue.issue_type).order_by(func.count().desc()).limit(12))]
              out['recovery_parents']=[{'job_id':j.job_id,'status':j.status,'cancel_requested':j.cancel_requested_at is not None,'pause_requested':j.pause_after_stage_requested_at is not None} for j in session.scalars(select(M.JobRun).where(M.JobRun.job_id.in_([e.get('parent_job_id') for e in entries])))]
              active=session.get(M.SettlementProjectionActive,'settlement')
              head=session.get(M.SettlementProjectionGeneration,active.generation_id) if active and active.generation_id else None
              out['active_head']={'generation_id':head.generation_id,'depth':head.lineage_depth,'kind':head.generation_kind,'state':head.state} if head else None
              out['compaction_estimate']=dict(session.execute(text('''WITH RECURSIVE chain AS (
                  SELECT generation_id,base_generation_id,0 AS hop FROM settlement_projection_generation WHERE generation_id=:head
                  UNION ALL SELECT g.generation_id,g.base_generation_id,c.hop+1 FROM settlement_projection_generation g JOIN chain c ON g.generation_id=c.base_generation_id WHERE c.hop<65
              ) SELECT (SELECT count(*) FROM chain) AS closure_rows,
                  (SELECT count(*) FROM (SELECT DISTINCT artifact,partition_key FROM settlement_projection_partition_manifest WHERE generation_id IN (SELECT generation_id FROM chain)) p) AS manifest_rows'''),{'head':head.generation_id if head else None}).mappings().one())
              out['heavy_jobs']=[{'job_id':j.job_id,'kind':j.job_kind,'status':j.status,'date':str(j.business_date),'stage':j.current_stage,'lease_expires_at':str(j.lease_expires_at)} for j in session.scalars(select(M.JobRun).where(M.JobRun.execution_slot=='heavy_sync',M.JobRun.status=='running').limit(5))]
          finally:
              gen.close()
          print(json.dumps(out))
          PY
          df -B1 --output=size,avail,pcent /opt/dy-dashboard
          sudo docker compose --env-file /opt/dy-dashboard/env/production.env -f deploy/compose.yaml exec -T worker python -c 'from apps.worker.scheduler import resolve_scheduler_mode; print("worker_scheduler_mode="+resolve_scheduler_mode())' </dev/null
          sudo docker compose --env-file /opt/dy-dashboard/env/production.env -f deploy/compose.yaml exec -T worker python - <<'DRIVER'
          import os,json,re
          progress='/tmp/dydata102-scoped-recovery-progress.jsonl'
          rows=[]
          if os.path.exists(progress):
              with open(progress) as f: rows=[json.loads(l) for l in f if l.strip()]
          pid=next((r.get('pid') for r in reversed(rows) if r.get('state')=='started'),None)
          alive=bool(pid and os.path.exists('/proc/'+str(pid)))
          classes=[];log='/tmp/dydata102-scoped-recovery-runtime.log'
          if os.path.exists(log):
              with open(log) as f:classes=re.findall(r'(?m)^([A-Za-z][A-Za-z0-9_.]*(?:Error|Exception)):',f.read())
          print(json.dumps({'driver_alive':alive,'driver_pid':pid,'driver_progress':rows[-10:],'driver_error_classes':classes}))
          DRIVER
          REMOTE
      - name: Fail closed, then publish the masked report
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/report.txt"
          test -s "$report"
          if grep -Eqi 'BEGIN [A-Z ]*PRIVATE KEY|(Cookie|Authorization):[[:space:]]*[^ ]|postgres(ql)?(\+[a-z]+)?://[^@[:space:]]*:[^@*[:space:]]*@|eyJ[A-Za-z0-9_-]{10,}\.' "$report"; then
            echo "::error::masking gate failed: a credential-shaped value survived masking; report withheld"
            exit 1
          fi
          cat "$report"
      - name: Upload masked report
        uses: actions/upload-artifact@v4
        with:
          name: dydata-102-103-readonly-diagnosis
          path: ${{ runner.temp }}/report.txt
          if-no-files-found: error
          retention-days: 14
