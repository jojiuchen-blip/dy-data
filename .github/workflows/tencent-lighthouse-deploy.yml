name: Tencent Lighthouse Deploy

# Isolated diagnosis ref: this file is the already-registered workflow path, so
# it stays dispatchable without touching the default branch. On this ref the
# workflow only performs read-only diagnosis: no build, no deploy, no database
# write, no API mode, and no change to frozen/confirmed/locked statements.
#
# Every SQL statement runs inside an explicit read-only transaction. Error
# evidence is limited to fields the application already persisted, masked on the
# server before it reaches the job log. Free-text container logs are never
# emitted, and no September source row is classified as settleable.

"on":
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: tencent-lighthouse-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    name: DYDATA-102/103 read-only production diagnosis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_SSH_PORT: ${{ vars.TENCENT_SSH_PORT }}
      TENCENT_SSH_USER: ${{ vars.TENCENT_SSH_USER }}
      TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
      TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
    steps:
      - name: Check required settings
        run: |
          for name in TENCENT_HOST TENCENT_SSH_USER TENCENT_SSH_KEY TENCENT_KNOWN_HOSTS; do
            [ -n "${!name}" ] || { echo "::error::$name is not configured"; exit 1; }
          done
      # The pinned host key is mandatory: StrictHostKeyChecking keeps its secure
      # default and a mismatch fails the job instead of being accepted.
      - name: Configure SSH with pinned host key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent_lighthouse
          chmod 600 ~/.ssh/tencent_lighthouse
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$TENCENT_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || { echo "::error::pinned host key does not cover TENCENT_HOST"; exit 1; }
      - name: Collect masked read-only evidence
        run: |
          ssh -i ~/.ssh/tencent_lighthouse -p "${TENCENT_SSH_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=5 \
            "$TENCENT_SSH_USER@$TENCENT_HOST" 'bash -s' <<'REMOTE' > "$RUNNER_TEMP/report.txt"
          set -euo pipefail
          export LC_ALL=C
          cd /opt/dy-dashboard/repo
          echo '# capacity'; df -Pk /opt/dy-dashboard/logs/backups
          echo '# docker aggregate'; sudo docker system df
          echo '# builder aggregate'; if sudo docker buildx version >/dev/null 2>&1; then sudo docker buildx du | tail -4; else echo buildx_unavailable; fi
          echo '# directory aggregates'
          for p in /opt/dy-dashboard/logs/backups /var/lib/docker/buildkit /var/log; do
            timeout 30 sudo du -sh "$p" || echo 'directory_scan_unavailable_or_timed_out'
          done
          echo '# container states and image ids'
          for cid in $(sudo docker ps -aq); do
            sudo docker inspect -f '{{.Name}}|{{.Config.Image}}|{{.Image}}|{{.State.Status}}' "$cid"
          done
          echo '# rollback image tags'
          sudo docker images --no-trunc --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.Size}}' | awk '/dy-dashboard-rollback:/'
          echo '# running deployment guard'
          if pgrep -f '[b]ash deploy/tencent/deploy.sh' >/dev/null; then echo deploy_running=true; else echo deploy_running=false; fi
          echo 'readonly=true deletions=0'
          REMOTE
      - name: Fail closed, then publish the masked report
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/report.txt"
          test -s "$report"
          if grep -Eqi 'BEGIN [A-Z ]*PRIVATE KEY|(Cookie|Authorization):[[:space:]]*[^ ]|postgres(ql)?(\+[a-z]+)?://[^@[:space:]]*:[^@*[:space:]]*@|eyJ[A-Za-z0-9_-]{10,}\.' "$report"; then
            echo "::error::masking gate failed: a credential-shaped value survived masking; report withheld"
            exit 1
          fi
          cat "$report"
      - name: Upload masked report
        uses: actions/upload-artifact@v4
        with:
          name: dydata-102-103-readonly-diagnosis
          path: ${{ runner.temp }}/report.txt
          if-no-files-found: error
          retention-days: 14
