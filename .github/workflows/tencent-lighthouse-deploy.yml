name: Tencent Lighthouse Deploy
on:
  workflow_dispatch:
concurrency:
  group: tencent-lighthouse-refs/heads/main
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    name: Switch verified ranking API image only
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_SSH_PORT: ${{ vars.TENCENT_SSH_PORT }}
      TENCENT_SSH_USER: ${{ vars.TENCENT_SSH_USER }}
      TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
      TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Require exact successful CI and no competing deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          def get(path):
              request=urllib.request.Request('https://api.github.com/repos/jojiuchen-blip/dy-data/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          ci=get('actions/runs/39214845483')
          assert ci['head_sha']=='393e3dab77f229840f6127e4d15fcd77939e471e' and ci['conclusion']=='success','Required exact CI has not passed'
          for status in ('in_progress','queued','waiting'):
              for run in get('actions/workflows/tencent-lighthouse-deploy.yml/runs?status='+status+'&per_page=100')['workflow_runs']:
                  assert str(run['id'])==os.environ['GITHUB_RUN_ID'],'Another deployment workflow is active'
          PY
      - name: Configure pinned SSH and upload reviewed runner
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent_lighthouse
          chmod 600 ~/.ssh/tencent_lighthouse
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          scp -i ~/.ssh/tencent_lighthouse -P "${TENCENT_SSH_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/pdca-ranking-api-patch-deploy.py "$TENCENT_SSH_USER@$TENCENT_HOST:/tmp/pdca-ranking-api-patch-deploy-393e3dab.py"
      - name: Switch API with exact-image health verification and rollback
        run: |
          ssh -i ~/.ssh/tencent_lighthouse -p "${TENCENT_SSH_PORT:-22}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$TENCENT_SSH_USER@$TENCENT_HOST" 'sudo python3 /tmp/pdca-ranking-api-patch-deploy-393e3dab.py'
