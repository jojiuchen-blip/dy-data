name: Tencent Lighthouse Deploy DYDATA-121

"on":
  workflow_dispatch:

concurrency:
  group: tencent-lighthouse-refs/heads/main
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  TARGET_SHA: dd55cc737c19792f97bfc8b2c6f32190a2a11405
  EXPECTED_BASE_SHA: f4f584e3fef4f5019d37805fc715435f90319716

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || vars.TENCENT_DEPLOY_ON_PUSH == 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dydata_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dydata_release"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      settlement-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dydata_t12
          POSTGRES_PASSWORD: dydata_t12_local_only
          POSTGRES_DB: dydata_t12
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U dydata_t12 -d dydata_t12"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Require complete prior verification evidence for the same application source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/runs/45551935060" > "$RUNNER_TEMP/prior.json"
          gh api "repos/${{ github.repository }}/actions/jobs/138994885251" > "$RUNNER_TEMP/prior-job.json"
          gh api "repos/${{ github.repository }}/contents/.github/workflows/tencent-lighthouse-deploy.yml?ref=6963c7d684ed56c4a02c1af5b34bfdd9a1ac8d81" --jq .content | base64 -d > "$RUNNER_TEMP/prior-workflow.yml"
          gh api "repos/${{ github.repository }}/actions/jobs/138994885251/logs" --allow-escape-sequences > "$RUNNER_TEMP/prior-test.log"
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "prior.json").read_text())
          job = json.loads((temp / "prior-job.json").read_text())
          assert run["status"] == "completed" and run["conclusion"] == "failure"
          assert run["head_sha"] == "6963c7d684ed56c4a02c1af5b34bfdd9a1ac8d81"
          assert job["run_id"] == run["id"] and job["name"] == "Verify"
          old_workflow = (temp / "prior-workflow.yml").read_text()
          target = os.environ["TARGET_SHA"]
          assert re.search(r"(?m)^  TARGET_SHA: " + re.escape(target) + "$", old_workflow)
          checks = {step["name"]: step for step in job["steps"]}
          failing = checks["Run tests"]
          assert failing["conclusion"] == "failure"
          assert all(step["conclusion"] == "success" for step in job["steps"] if step["number"] < failing["number"])
          assert checks["Verify DYDATA-104 financial preview and operation buttons in Chromium"]["conclusion"] == "success"
          log = (temp / "prior-test.log").read_text(encoding="utf-8", errors="replace")
          log = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", log)
          failures = re.findall(r"(?m)^.*?Z FAILED (tests/[^ ]+) - ", log)
          assert len(failures) == 1 and failures[0].startswith(
              "tests/test_dydata105_buttons_browser.py::test_dydata105_store_confirm_invoice_lifecycle_and_replacement_real_readback["
          ) and failures[0].endswith("-RED_FLUSHED-1]")
          assert "1 failed, 6161 passed, 628 skipped" in log
          print("Verified prior full-suite coverage and successful dedicated browser gate", target, run["id"])
          PY

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Verify the pinned application source
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browser
        run: |
          # Bound individual mirror connections; never bypass failed setup.
          printf '%s\n' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            'Acquire::Retries "2";' \
            | sudo tee /etc/apt/apt.conf.d/zzzz-codex-playwright-network >/dev/null
          # Playwright downloads its own Chromium; the runner's unrelated
          # Chrome apt feed can block dependency installation during CDN sync.
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            if grep -q 'dl.google.com/linux/chrome' "$source"; then
              sudo mv -- "$source" "${source}.disabled"
            fi
          done
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            # The full archive also publishes the signed security suites.
            printf '%s\n' \
              'https://archive.ubuntu.com/ubuntu' \
              | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu|g' "$source"
          done
          sudo apt-config dump | grep -E '^Acquire::(http::Timeout|https::Timeout|Retries)'
          sudo apt-config dump | grep -Fx 'Acquire::http::Timeout "30";'
          sudo apt-config dump | grep -Fx 'Acquire::https::Timeout "30";'
          sudo apt-config dump | grep -Fx 'Acquire::Retries "2";'
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out 'Ubuntu archive HTTP %{http_code} in %{time_total}s\n' \
            https://archive.ubuntu.com/ubuntu/dists/noble/InRelease
          timeout 10m python -m playwright install chromium --with-deps

      - name: Reverify the timed-out invoice scenario and routing collection
        timeout-minutes: 10
        run: |
          python -m pytest -q -ra tests/test_dydata105_buttons_browser.py --junitxml="$RUNNER_TEMP/invoice-recheck.xml"
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path(os.environ["RUNNER_TEMP"]) / "invoice-recheck.xml"
          matches = [case for case in ElementTree.parse(report).iter("testcase")
                     if case.get("name", "").startswith("test_dydata105_store_confirm_invoice_lifecycle_and_replacement_real_readback")
                     and case.get("name", "").endswith("-RED_FLUSHED-1]")]
          assert len(matches) == 1 and not any(matches[0].find(tag) is not None for tag in ("failure", "error", "skipped")), "Exact prior timeout case must execute and pass"
          PY
          python -m pytest -q tests/test_clue_routing_store_sync.py tests/test_worker_collection_pipeline.py

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

      - name: Build API Docker image
        run: docker build --build-arg PIP_INDEX_URL=https://pypi.org/simple -f apps/api/Dockerfile -t dy-dashboard-api:ci .

      - name: Build Worker Docker image
        run: docker build --build-arg PIP_INDEX_URL=https://pypi.org/simple -f apps/worker/Dockerfile -t dy-dashboard-worker:ci .

      - name: Build Browser Docker image
        run: docker build --build-arg PIP_INDEX_URL=https://pypi.org/simple -f deploy/browser/Dockerfile -t dy-dashboard-browser:ci .

      - name: Verify browser image dependency compatibility
        timeout-minutes: 5
        run: |
          mkdir -p logs/ci
          docker run --rm --network none --entrypoint python3 dy-dashboard-browser:ci -c 'from importlib.metadata import version; from pathlib import Path; import PIL; from PIL import Image; assert PIL.__version__ == version("Pillow") == "13.0.0"; assert all(Path(module.__file__).resolve().is_relative_to("/usr/local/lib") for module in (PIL, Image))'
          docker run --rm --network none --entrypoint python3 -v "$PWD/tests/test_browser_image_dependency_compat.py:/tmp/test_browser_image_dependency_compat.py:ro" -v "$PWD/logs/ci:/verification" dy-dashboard-browser:ci -m pytest -q -ra -p no:cacheprovider /tmp/test_browser_image_dependency_compat.py --junitxml=/verification/dydata104-browser-image.xml
          python -c 'import xml.etree.ElementTree as E; suites = list(E.parse("logs/ci/dydata104-browser-image.xml").getroot().iter("testsuite")); assert suites and sum(int(s.get("tests", 0)) for s in suites) == 3, "browser image gate must execute exactly three tests"; assert all(int(s.get(k, 0)) == 0 for s in suites for k in ("skipped", "failures", "errors")), "browser image gate must not skip or fail selected tests"'
          python -c 'import xml.etree.ElementTree as E; cases = list(E.parse("logs/ci/dydata104-browser-image.xml").getroot().iter("testcase")); executed = {c.get("name", "") for c in cases if c.get("classname", "").endswith("test_browser_image_dependency_compat") and not any(c.find(status) is not None for status in ("skipped", "failure", "error"))}; image_required = {"test_browser_pillow_rgb_image_round_trip[PNG]", "test_browser_pillow_rgb_image_round_trip[TIFF]", "test_browser_requests_urllib3_pool_handles_regular_and_chunked_responses"}; assert image_required <= executed, "browser image compatibility cases were not executed successfully"'

      - name: Verify browser process recovery in the built image
        timeout-minutes: 10
        env:
          DY_BROWSER_RECOVERY_IMAGE: dy-dashboard-browser:ci
        run: |
          mkdir -p logs/ci
          python -m pytest -q -ra tests/test_browser_process_recovery_image.py --junitxml=logs/ci/dydata104-browser-recovery.xml
          python -c 'import xml.etree.ElementTree as E; suites = list(E.parse("logs/ci/dydata104-browser-recovery.xml").getroot().iter("testsuite")); assert suites and sum(int(s.get("tests", 0)) for s in suites) == 3, "browser recovery gate must execute three real process recovery cases"; assert all(int(s.get(k, 0)) == 0 for s in suites for k in ("skipped", "failures", "errors")), "browser recovery gate must not skip or fail selected tests"'

      - name: Upload DYDATA-104 browser image verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dydata104-browser-image-${{ github.job }}-${{ github.sha }}
          path: |
            logs/ci/dydata104-browser-image.xml
            logs/ci/dydata104-browser-recovery.xml
          if-no-files-found: warn

      - name: Build Web Docker image
        run: docker build -f apps/web/Dockerfile -t dy-dashboard-web:ci apps/web

  deploy:
    name: Deploy Tencent Lighthouse
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'workflow_dispatch' || vars.TENCENT_DEPLOY_ON_PUSH == 'true'
    timeout-minutes: 55

    env:
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_SSH_PORT: ${{ vars.TENCENT_SSH_PORT }}
      TENCENT_SSH_USER: ${{ vars.TENCENT_SSH_USER }}
      TENCENT_APT_MIRROR: ${{ vars.TENCENT_APT_MIRROR }}
      TENCENT_START_WORKER: ${{ vars.TENCENT_START_WORKER }}
      DY_WEB_BASE_URL: ${{ vars.DY_WEB_BASE_URL }}
      TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
      TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Check required Tencent deployment settings
        run: |
          required=(
            TENCENT_HOST
            TENCENT_SSH_USER
            DY_WEB_BASE_URL
            TENCENT_START_WORKER
            TENCENT_SSH_KEY
            TENCENT_KNOWN_HOSTS
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done
          if [ "$TENCENT_START_WORKER" != "true" ]; then
            echo "::error::TENCENT_START_WORKER must be true for recoverable finance detection jobs"
            exit 1
          fi

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent_lighthouse
          chmod 600 ~/.ssh/tencent_lighthouse
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          port="${TENCENT_SSH_PORT:-22}"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          archive="/tmp/dy-dashboard-${TARGET_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"

          git archive --format=tar "$TARGET_SHA" | gzip > /tmp/dy-dashboard-source.tar.gz
          archive_hash="$(sha256sum /tmp/dy-dashboard-source.tar.gz | cut -d' ' -f1)"
          scp -i ~/.ssh/tencent_lighthouse \
            -P "$port" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            /tmp/dy-dashboard-source.tar.gz \
            "$TENCENT_SSH_USER@$TENCENT_HOST:$archive"

          cat > /tmp/tencent-deploy-bootstrap.sh <<'REMOTE'
          set -euo pipefail
          target_sha="$1"
          archive_path="$2"
          web_base_url="$3"
          start_worker="$4"
          expected_hash="$5"
          expected_base="$6"
          app_dir="/opt/dy-dashboard/repo"
          parent="/opt/dy-dashboard"
          log_dir="$parent/logs"
          apt_mirror="${TENCENT_APT_MIRROR:-http://mirrors.tencentyun.com}"
          test "$(id -u)" = 0
          test "$(readlink -f "$parent")" = "$parent"
          test ! -L "$archive_path"
          test -f "$archive_path"
          test "$(sha256sum "$archive_path" | cut -d' ' -f1)" = "$expected_hash"
          exec 9>/run/dy-dashboard-release.lock
          flock -n 9
          if pgrep -af '[b]ash deploy/tencent/deploy.sh'; then
            echo 'Existing deployment is active; refusing overlap'
            exit 1
          fi
          receipt="$log_dir/last-deploy.json"
          current="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha"])' "$receipt")"
          test "$current" = "$expected_base"
          printf 'Verified production baseline %s\n' "$current"
          # Keep the immutable source archive beside the source trees. The
          # helper rejects symlinks, traversal, identity drift and low capacity.
          staged_archive="$parent/$(basename "$archive_path")"
          test ! -e "$staged_archive" && test ! -L "$staged_archive"
          mv -T -- "$archive_path" "$staged_archive"
          helper="$(mktemp /tmp/dy-source-stager.XXXXXX.py)"
          trap 'rm -f -- "$helper" "$staged_archive"' EXIT
          tar -xOf "$staged_archive" scripts/stage_deploy_source.py > "$helper"
          python3 "$helper" --app-dir "$app_dir" --archive "$staged_archive" --sha256 "$expected_hash"
          test ! -L "$log_dir"
          mkdir -p "$log_dir"
          cd "$app_dir"
          # Retain the original backup, migration, publication and health gates.
          SKIP_GIT_SYNC=true APT_MIRROR="$apt_mirror" DY_WEB_BASE_URL="$web_base_url" TENCENT_START_WORKER="$start_worker" \
            PUBLICATION_WARM_TIMEOUT_SECONDS=600 bash deploy/tencent/deploy.sh "$target_sha"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["sha"]==sys.argv[2] and d["environment"]=="production"; print("production_release_receipt",d["ts"],d["sha"])' "$receipt" "$target_sha"
          docker compose --env-file /opt/dy-dashboard/env/production.env -f deploy/compose.yaml exec -T postgres \
            sh -c 'exec psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At' <<'SQL'
          BEGIN READ ONLY;
          SELECT 'alembic_revision', version_num FROM alembic_version;
          SELECT 'routing_enabled', count(*) FROM clue_product_routing_configs WHERE routing_enabled;
          SELECT 'catalogue_snapshot_count', count(*) FROM clue_product_douyin_store_scopes;
          COMMIT;
          SQL
          REMOTE
          ssh -i ~/.ssh/tencent_lighthouse \
            -p "$port" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "$TENCENT_SSH_USER@$TENCENT_HOST" \
            "sudo -n bash -s -- '$TARGET_SHA' '$archive' '$DY_WEB_BASE_URL' '$TENCENT_START_WORKER' '$archive_hash' '$EXPECTED_BASE_SHA'" < /tmp/tencent-deploy-bootstrap.sh
