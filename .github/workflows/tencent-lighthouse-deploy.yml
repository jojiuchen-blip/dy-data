name: Tencent Lighthouse Deploy

# Isolated operational ref. Cleans unused builder cache only; validates
# unchanged containers, rollback image tags and volume inventory.
# Does not deploy or write application/database/backup data.

"on":
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: tencent-lighthouse-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    name: DYDATA-102/103 scoped dangling build cache maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_SSH_PORT: ${{ vars.TENCENT_SSH_PORT }}
      TENCENT_SSH_USER: ${{ vars.TENCENT_SSH_USER }}
      TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
      TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
    steps:
      - name: Check required settings
        run: |
          for name in TENCENT_HOST TENCENT_SSH_USER TENCENT_SSH_KEY TENCENT_KNOWN_HOSTS; do
            [ -n "${!name}" ] || { echo "::error::$name is not configured"; exit 1; }
          done
      # The pinned host key is mandatory: StrictHostKeyChecking keeps its secure
      # default and a mismatch fails the job instead of being accepted.
      - name: Configure SSH with pinned host key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent_lighthouse
          chmod 600 ~/.ssh/tencent_lighthouse
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$TENCENT_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || { echo "::error::pinned host key does not cover TENCENT_HOST"; exit 1; }
      - name: Collect masked read-only evidence
        run: |
          ssh -i ~/.ssh/tencent_lighthouse -p "${TENCENT_SSH_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=5 \
            "$TENCENT_SSH_USER@$TENCENT_HOST" 'bash -s' <<'REMOTE' > "$RUNNER_TEMP/report.txt"
          set -euo pipefail
          cd /opt/dy-dashboard/repo
          if pgrep -f '[b]ash deploy/tencent/deploy.sh' >/dev/null; then echo deployment_active_abort; exit 1; fi
          sudo docker compose --env-file /opt/dy-dashboard/env/production.env -f deploy/compose.yaml exec -T worker python - <<'PY'
          import json, hashlib
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          from sqlalchemy.orm import Session
          from apps.api.dy_api.db import get_engine
          from apps.api.dy_api.models import JobRun, JobEvent
          from apps.worker.day_recovery import plan_day_recovery, recovery_generation_by_request_key, RECOVERY_ROOT_KEY, RECOVERY_ORDINAL_KEY
          parents={14:'range-sync-10562f3369ac7d31e9801d42d8db1d60',16:'range-sync-b8240d2b853eb56d2f6fd3910715b843',20:'range-sync-c0aab7cd41ce85ad64c9b548bfc2963c',25:'range-sync-c2e1f2c4d97029919d0c36bbb7fb4779',28:'range-sync-bea11f1fc74ddb7ad7d5b29f9c065ca5'}
          out=[]; engine=get_engine(); assert engine is not None
          with Session(engine,autoflush=False) as session, session.begin():
              for d,pid in parents.items():
                  parent=session.get(JobRun,pid); assert parent is not None
                  assert parent.window_start.astimezone(ZoneInfo('Asia/Shanghai')).date().isoformat()==f'2026-09-{d:02d}'
                  key=f'dydata102-recover-2026-09-{d:02d}-a'
                  prior=recovery_generation_by_request_key(session,key)
                  if prior is not None:
                      assert (prior.metadata_json or {}).get(RECOVERY_ROOT_KEY)==pid
                      generated=prior; replayed=True
                  else:
                      fields=('status','attempt_count','max_attempts','lease_epoch','lease_expires_at','error_code')
                      before=tuple(getattr(parent,k) for k in fields)
                      plan,replayed=plan_day_recovery(session,parent=parent,request_key=key,reason='DYDATA-102 authorized recovery of exhausted September day after materialization lock fix',actor='codex-dydata-102-authorized')
                      generated=session.get(JobRun,plan.parent_job_id); assert generated is not None
                      assert tuple(getattr(parent,k) for k in fields)==before
                      eventkey='maint-recover:'+hashlib.sha256(key.encode()).hexdigest()
                      session.add(JobEvent(event_id=eventkey,job_id=pid,event_type='maintenance_recovery_requested',from_status=parent.status,to_status=parent.status,actor_type='system',actor_id='codex-dydata-102-authorized',reason='User authorized scoped production recovery in this session; retain original attempts and leases',idempotency_key=eventkey,payload_json={'issue':'DYDATA-102','authorization':'explicit user authorization in current Codex session','request_key':key,'recovery_parent_job_id':generated.job_id,'generation_ordinal':(generated.metadata_json or {}).get(RECOVERY_ORDINAL_KEY)},occurred_at=datetime.now(timezone.utc)))
                  out.append({'date':f'2026-09-{d:02d}','original_parent':pid,'recovery_parent':generated.job_id,'replayed':replayed,'ordinal':(generated.metadata_json or {}).get(RECOVERY_ORDINAL_KEY)})
              session.flush()
          print(json.dumps({'committed':True,'scope':'five_september_recovery_generations_only','plans':out},sort_keys=True))
          PY
          REMOTE
      - name: Fail closed, then publish the masked report
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/report.txt"
          test -s "$report"
          if grep -Eqi 'BEGIN [A-Z ]*PRIVATE KEY|(Cookie|Authorization):[[:space:]]*[^ ]|postgres(ql)?(\+[a-z]+)?://[^@[:space:]]*:[^@*[:space:]]*@|eyJ[A-Za-z0-9_-]{10,}\.' "$report"; then
            echo "::error::masking gate failed: a credential-shaped value survived masking; report withheld"
            exit 1
          fi
          cat "$report"
      - name: Upload masked report
        uses: actions/upload-artifact@v4
        with:
          name: dydata-102-103-readonly-diagnosis
          path: ${{ runner.temp }}/report.txt
          if-no-files-found: error
          retention-days: 14
