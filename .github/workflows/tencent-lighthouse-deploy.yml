name: Tencent Lighthouse Deploy

"on":
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: tencent-lighthouse-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || vars.TENCENT_DEPLOY_ON_PUSH == 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dydata_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dydata_release"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      settlement-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dydata_t12
          POSTGRES_PASSWORD: dydata_t12_local_only
          POSTGRES_DB: dydata_t12
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U dydata_t12 -d dydata_t12"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Select current formal delivery plan
        run: node scripts/prepare_governance_plan.mjs .

      - name: Run project governance gates
        run: |
          npm --prefix .agent/project-manager-suite run test:ai-pm
          node .agent/project-manager-suite/tools/verify-suite-lock.mjs .
          node .agent/project-manager-suite/tools/check-protocol-alignment.mjs .agent/project-manager-suite
          node .agent/project-manager-suite/tools/validate-global-files.mjs .
          node .agent/project-manager-suite/tools/route-check.mjs .

      - name: Run real PostgreSQL release gate
        env:
          DY_RELEASE_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_release
        run: |
          python scripts/verify_postgres_release_gate.py
          python -m pytest -q tests/test_settlement_rebuild_postgres.py
          python -m pytest -q tests/test_priority_budget_pause_postgres.py
          python -m pytest -q tests/test_shop_poi_postgres.py

      - name: Verify clue state transitions on PostgreSQL
        env:
          DYDATA_CLUE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_clue_test
          DYDATA_RANKING_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_clue_test
        run: |
          python -c 'import psycopg; conn = psycopg.connect("host=127.0.0.1 port=5432 dbname=dydata_release user=postgres password=postgres", autocommit=True); conn.execute("CREATE DATABASE dydata_clue_test"); conn.close()'
          python -m pytest -q tests/test_clue_follow_up_postgres.py tests/test_formal_allocation_runtime_postgres.py tests/test_ranking_lifecycle_postgres.py tests/test_clue_materialization_lock_wait.py

      - name: Verify static dashboard publications on PostgreSQL
        env:
          DYDATA_PUBLICATION_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_publication_test
        run: |
          python -c 'import psycopg; conn = psycopg.connect("host=127.0.0.1 port=5432 dbname=dydata_release user=postgres password=postgres", autocommit=True); conn.execute("CREATE DATABASE dydata_publication_test"); conn.close()'
          python -m pytest -q tests/test_dashboard_publications_postgres.py tests/test_dashboard_publication_*_postgres.py tests/test_dashboard_publication_migration.py tests/test_api_promotion_invoice_postgres.py tests/test_settlement_rule_patch_postgres.py tests/test_supplement_sku_catalog_postgres.py tests/test_historical_sale_attribution_postgres.py tests/test_product_sync_sku_lookup_postgres.py

      # Full pytest may skip opt-in PG cases. This gate must execute every
      # selected case, including finance concurrency and immutable month-end DDL.
      - name: Verify DYDATA-104 financial operations and month-end evidence on PostgreSQL
        timeout-minutes: 30
        env:
          DYDATA_FINANCE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_delivery_test
          DYDATA_HISTORICAL_FEE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_delivery_test
          DYDATA_PROTECTED_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_delivery_test
          DYDATA_MISSING_FEE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_delivery_test
          DYDATA_T12_TEST_DATABASE_URL: postgresql+psycopg://dydata_t12:dydata_t12_local_only@127.0.0.1:55432/dydata_t12
          DYDATA_PUBLICATION_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_publication_test
        run: |
          mkdir -p logs/ci
          python -c 'import psycopg; conn = psycopg.connect("host=127.0.0.1 port=5432 dbname=dydata_release user=postgres password=postgres", autocommit=True); conn.execute("CREATE DATABASE dydata_delivery_test"); conn.close()'
          python -m pytest -q -ra tests/test_dydata104_finance_state_matrix.py tests/test_account_qualification_postgres.py tests/test_historical_fee_correction_postgres.py tests/test_protected_billing_authority_postgres.py tests/test_product_sync_completeness_postgres.py tests/test_product_sync_sku_lookup_postgres.py tests/test_month_close_auto_bootstrap_postgres.py tests/test_missing_fee_repair_postgres.py tests/test_settlement_verify_impact_selection.py --junitxml=logs/ci/dydata104-postgres.xml
          python -c 'import xml.etree.ElementTree as E; suites = list(E.parse("logs/ci/dydata104-postgres.xml").getroot().iter("testsuite")); assert suites and sum(int(s.get("tests", 0)) for s in suites) > 0, "DYDATA-104 PostgreSQL gate collected no tests"; assert all(int(s.get(k, 0)) == 0 for s in suites for k in ("skipped", "failures", "errors")), "DYDATA-104 PostgreSQL gate must not skip or fail selected tests"'
          python -c 'import xml.etree.ElementTree as E; cases = list(E.parse("logs/ci/dydata104-postgres.xml").getroot().iter("testcase")); executed = [c for c in cases if c.get("classname", "").endswith("test_settlement_verify_impact_selection") and "postgres" in c.get("name", "")]; assert len(executed) == 11 and all(not any(c.find(status) is not None for status in ("skipped", "failure", "error")) for c in executed), "all eleven verify impact PostgreSQL cases must execute successfully"'
          # The complete authority file also owns the publication-only coordinator.
          python -c 'import xml.etree.ElementTree as E; cases = list(E.parse("logs/ci/dydata104-postgres.xml").getroot().iter("testcase")); executed = {c.get("name", "") for c in cases if c.get("classname", "").endswith("test_protected_billing_authority_postgres")}; required = {"test_postgres_publication_only_complete_apply[metadata]", "test_postgres_publication_only_complete_apply[migration]", "test_postgres_publication_only_atomic_billing_rollback", "test_postgres_publication_only_refuses_existing_heavy_claim_lock"}; assert required <= executed, "publication-only coordinator PostgreSQL cases were not executed"'
          # Require both legacy modes plus concurrency and fail-closed bootstrap cases.
          python -c 'import xml.etree.ElementTree as E; cases = list(E.parse("logs/ci/dydata104-postgres.xml").getroot().iter("testcase")); executed = {c.get("name", "") for c in cases if c.get("classname", "").endswith("test_month_close_auto_bootstrap_postgres") and not any(c.find(status) is not None for status in ("skipped", "failure", "error"))}; bootstrap_required = {"test_postgres_automatic_bootstrap_rebuilds_and_publishes_real_full_month[False]", "test_postgres_automatic_bootstrap_rebuilds_and_publishes_real_full_month[True]", "test_postgres_concurrent_ticks_share_frozen_input_job_without_resetting_attempts", "test_postgres_full_without_active_rolls_back_unknown_october_aggregates", "test_postgres_unqualified_legacy_current_rolls_back_month_economics"}; assert bootstrap_required <= executed, "automatic month-close bootstrap PostgreSQL cases were not executed successfully"'
          # Require real apply/replay, rollback, drift, protection and concurrency receipts.
          python -c 'import xml.etree.ElementTree as E; cases = list(E.parse("logs/ci/dydata104-postgres.xml").getroot().iter("testcase")); executed = {c.get("name", "") for c in cases if c.get("classname", "").endswith("test_missing_fee_repair_postgres") and not any(c.find(status) is not None for status in ("skipped", "failure", "error"))}; missing_fee_required = {"test_postgres_active_source_writer_rejects[retry_wait]", "test_postgres_active_source_writer_rejects[running]", "test_postgres_all_target_protection_facts_reject[confirmation]", "test_postgres_all_target_protection_facts_reject[confirmed]", "test_postgres_all_target_protection_facts_reject[historical-lock]", "test_postgres_all_target_protection_facts_reject[invoice]", "test_postgres_all_target_protection_facts_reject[locked]", "test_postgres_all_target_protection_facts_reject[orphan-dispute]", "test_postgres_any_historical_direction_status_month_rejects[2026-08-2-False]", "test_postgres_any_historical_direction_status_month_rejects[2026-08-3-False]", "test_postgres_any_historical_direction_status_month_rejects[2026-09-1-True]", "test_postgres_apply_commit_readback_and_exact_idempotence[metadata]", "test_postgres_apply_commit_readback_and_exact_idempotence[migration]", "test_postgres_existing_source_transaction_times_out_without_writes", "test_postgres_full_dependency_drift_rejects_zero_writes[binding]", "test_postgres_full_dependency_drift_rejects_zero_writes[new-rate]", "test_postgres_full_dependency_drift_rejects_zero_writes[rate]", "test_postgres_full_dependency_drift_rejects_zero_writes[raw-order]", "test_postgres_full_dependency_drift_rejects_zero_writes[receipt]", "test_postgres_full_dependency_drift_rejects_zero_writes[scope]", "test_postgres_full_dependency_drift_rejects_zero_writes[sibling]", "test_postgres_full_dependency_drift_rejects_zero_writes[sku]", "test_postgres_full_dependency_drift_rejects_zero_writes[store-name]", "test_postgres_heavy_claim_conflict_rejects", "test_postgres_preview_select_only", "test_postgres_relation_fences_block_insert_phantoms[config]", "test_postgres_relation_fences_block_insert_phantoms[protection]", "test_postgres_relation_fences_block_insert_phantoms[raw]", "test_postgres_remaining_wall_budget_clamps_statement_timeout", "test_postgres_reviewed_batch_representative_budget_receipt[10]", "test_postgres_reviewed_batch_representative_budget_receipt[20]", "test_postgres_reviewed_batch_representative_budget_receipt[373]", "test_postgres_reviewed_batch_representative_budget_receipt[50]", "test_postgres_transaction_characteristics_and_fixed_timeouts", "test_postgres_unexpected_writer_outputs_roll_back_entire_batch[adjustment-count]", "test_postgres_unexpected_writer_outputs_roll_back_entire_batch[budget]", "test_postgres_unexpected_writer_outputs_roll_back_entire_batch[fields]", "test_postgres_unexpected_writer_outputs_roll_back_entire_batch[outside]"}; assert missing_fee_required <= executed, "missing-fee repair PostgreSQL cases were not executed successfully"'

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browser
        run: |
          # Bound individual mirror connections; never bypass failed setup.
          printf '%s\n' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            'Acquire::Retries "2";' \
            | sudo tee /etc/apt/apt.conf.d/zzzz-codex-playwright-network >/dev/null
          # Playwright downloads its own Chromium; the runner's unrelated
          # Chrome apt feed can block dependency installation during CDN sync.
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            if grep -q 'dl.google.com/linux/chrome' "$source"; then
              sudo mv -- "$source" "${source}.disabled"
            fi
          done
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            # The full archive also publishes the signed security suites.
            printf '%s\n' \
              'https://archive.ubuntu.com/ubuntu' \
              | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu|g' "$source"
          done
          sudo apt-config dump | grep -E '^Acquire::(http::Timeout|https::Timeout|Retries)'
          sudo apt-config dump | grep -Fx 'Acquire::http::Timeout "30";'
          sudo apt-config dump | grep -Fx 'Acquire::https::Timeout "30";'
          sudo apt-config dump | grep -Fx 'Acquire::Retries "2";'
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out 'Ubuntu archive HTTP %{http_code} in %{time_total}s\n' \
            https://archive.ubuntu.com/ubuntu/dists/noble/InRelease
          timeout 10m python -m playwright install chromium --with-deps

      - name: Verify DYDATA-104 financial preview and operation buttons in Chromium
        timeout-minutes: 15
        run: |
          mkdir -p logs/ci
          python -m pytest -q -ra tests/test_dydata104_finance_preview_browser.py tests/test_dydata105_buttons_browser.py --junitxml=logs/ci/dydata104-finance-browser.xml
          python -c 'import xml.etree.ElementTree as E; suites = list(E.parse("logs/ci/dydata104-finance-browser.xml").getroot().iter("testsuite")); assert suites and sum(int(s.get("tests", 0)) for s in suites) > 0, "DYDATA-104 browser gate collected no tests"; assert all(int(s.get(k, 0)) == 0 for s in suites for k in ("skipped", "failures", "errors")), "DYDATA-104 browser gate must not skip or fail selected tests"'

      - name: Upload DYDATA-104 verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dydata104-verification-${{ github.job }}-${{ github.sha }}
          path: |
            logs/ci/dydata104-postgres.xml
            logs/ci/dydata104-finance-browser.xml
          if-no-files-found: warn

      - name: Run tests
        run: python -m pytest

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

      - name: Build API Docker image
        run: docker build --build-arg PIP_INDEX_URL=https://pypi.org/simple -f apps/api/Dockerfile -t dy-dashboard-api:ci .

      - name: Build Worker Docker image
        run: docker build --build-arg PIP_INDEX_URL=https://pypi.org/simple -f apps/worker/Dockerfile -t dy-dashboard-worker:ci .

      - name: Build Browser Docker image
        run: docker build --build-arg PIP_INDEX_URL=https://pypi.org/simple -f deploy/browser/Dockerfile -t dy-dashboard-browser:ci .

      - name: Verify browser image dependency compatibility
        timeout-minutes: 5
        run: |
          mkdir -p logs/ci
          docker run --rm --network none --entrypoint python3 dy-dashboard-browser:ci -c 'from importlib.metadata import version; from pathlib import Path; import PIL; from PIL import Image; assert PIL.__version__ == version("Pillow") == "13.0.0"; assert all(Path(module.__file__).resolve().is_relative_to("/usr/local/lib") for module in (PIL, Image))'
          docker run --rm --network none --entrypoint python3 -v "$PWD/tests/test_browser_image_dependency_compat.py:/tmp/test_browser_image_dependency_compat.py:ro" -v "$PWD/logs/ci:/verification" dy-dashboard-browser:ci -m pytest -q -ra -p no:cacheprovider /tmp/test_browser_image_dependency_compat.py --junitxml=/verification/dydata104-browser-image.xml
          python -c 'import xml.etree.ElementTree as E; suites = list(E.parse("logs/ci/dydata104-browser-image.xml").getroot().iter("testsuite")); assert suites and sum(int(s.get("tests", 0)) for s in suites) == 3, "browser image gate must execute exactly three tests"; assert all(int(s.get(k, 0)) == 0 for s in suites for k in ("skipped", "failures", "errors")), "browser image gate must not skip or fail selected tests"'
          python -c 'import xml.etree.ElementTree as E; cases = list(E.parse("logs/ci/dydata104-browser-image.xml").getroot().iter("testcase")); executed = {c.get("name", "") for c in cases if c.get("classname", "").endswith("test_browser_image_dependency_compat") and not any(c.find(status) is not None for status in ("skipped", "failure", "error"))}; image_required = {"test_browser_pillow_rgb_image_round_trip[PNG]", "test_browser_pillow_rgb_image_round_trip[TIFF]", "test_browser_requests_urllib3_pool_handles_regular_and_chunked_responses"}; assert image_required <= executed, "browser image compatibility cases were not executed successfully"'

      - name: Upload DYDATA-104 browser image verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dydata104-browser-image-${{ github.job }}-${{ github.sha }}
          path: logs/ci/dydata104-browser-image.xml
          if-no-files-found: warn

      - name: Build Web Docker image
        run: docker build -f apps/web/Dockerfile -t dy-dashboard-web:ci apps/web

  deploy:
    name: Deploy Tencent Lighthouse
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'workflow_dispatch' || vars.TENCENT_DEPLOY_ON_PUSH == 'true'
    timeout-minutes: 30

    env:
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_SSH_PORT: ${{ vars.TENCENT_SSH_PORT }}
      TENCENT_SSH_USER: ${{ vars.TENCENT_SSH_USER }}
      TENCENT_APT_MIRROR: ${{ vars.TENCENT_APT_MIRROR }}
      TENCENT_START_WORKER: ${{ vars.TENCENT_START_WORKER }}
      DY_WEB_BASE_URL: ${{ vars.DY_WEB_BASE_URL }}
      TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
      TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required Tencent deployment settings
        run: |
          required=(
            TENCENT_HOST
            TENCENT_SSH_USER
            DY_WEB_BASE_URL
            TENCENT_START_WORKER
            TENCENT_SSH_KEY
            TENCENT_KNOWN_HOSTS
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done
          if [ "$TENCENT_START_WORKER" != "true" ]; then
            echo "::error::TENCENT_START_WORKER must be true for recoverable finance detection jobs"
            exit 1
          fi

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent_lighthouse
          chmod 600 ~/.ssh/tencent_lighthouse
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          port="${TENCENT_SSH_PORT:-22}"
          archive="/tmp/dy-dashboard-${GITHUB_SHA}.tar.gz"

          git archive --format=tar "$GITHUB_SHA" | gzip > /tmp/dy-dashboard-source.tar.gz
          scp -i ~/.ssh/tencent_lighthouse \
            -P "$port" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            /tmp/dy-dashboard-source.tar.gz \
            "$TENCENT_SSH_USER@$TENCENT_HOST:$archive"

          cat > /tmp/tencent-deploy-bootstrap.sh <<'REMOTE'
          set -euo pipefail
          target_sha="$1"
          archive_path="$2"
          web_base_url="$3"
          start_worker="$4"
          app_dir="${APP_DIR:-/opt/dy-dashboard/repo}"
          log_dir="${LOG_DIR:-/opt/dy-dashboard/logs}"
          apt_mirror="${TENCENT_APT_MIRROR:-http://mirrors.tencentyun.com}"

          mkdir -p "$app_dir" "$log_dir"
          cd "$app_dir"
          if [ -d .git ] && (! git diff --quiet || ! git diff --cached --quiet); then
            dirty_stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            git status --short > "$log_dir/pre-bootstrap-dirty-$dirty_stamp.status"
            git diff > "$log_dir/pre-bootstrap-dirty-$dirty_stamp.patch"
          fi

          find "$app_dir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          tar -xzf "$archive_path" -C "$app_dir"
          rm -f "$archive_path"

          SKIP_GIT_SYNC=true APT_MIRROR="$apt_mirror" DY_WEB_BASE_URL="$web_base_url" TENCENT_START_WORKER="$start_worker" bash deploy/tencent/deploy.sh "$target_sha"
          REMOTE
          ssh -i ~/.ssh/tencent_lighthouse \
            -p "$port" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "$TENCENT_SSH_USER@$TENCENT_HOST" \
            "bash -s -- '$GITHUB_SHA' '$archive' '$DY_WEB_BASE_URL' '$TENCENT_START_WORKER'" < /tmp/tencent-deploy-bootstrap.sh
