# Temporary R0 relay workflow for the isolated ops ref.
# Read-only connection/resource probe: no deploy, restart, SQL, or production file writes.

name: DYDATA-104 READ ONLY resource probe

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dydata104-readonly-r0
  cancel-in-progress: false

jobs:
  readonly-resource-probe:
    name: DYDATA-104 read-only connection and resource probe
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_SSH_PORT: ${{ vars.TENCENT_SSH_PORT }}
      TENCENT_SSH_USER: ${{ vars.TENCENT_SSH_USER }}
    steps:
      - name: Checkout dispatched ref
        uses: actions/checkout@v4
        with:
          # Exact commit selected by the dispatch event; no fixed app ref.
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run bounded read-only probe and sanitize report
        id: probe
        env:
          TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
          TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
        run: |
          set -uo pipefail
          set +e
          umask 077

          work="$RUNNER_TEMP/dydata104-r0"
          install -m 700 -d "$work"
          stdout="$work/probe.stdout"
          stderr="$work/probe.stderr"
          report="$work/report.txt"
          key="$work/ssh_key"
          known="$work/known_hosts"
          trap 'rm -f "$key" "$known"' EXIT
          : > "$stdout"
          : > "$stderr"
          : > "$report"

          phase_begin="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          started=$SECONDS
          prep_error=""
          rc=78
          result=setup_failure

          printf '=== DYDATA-104 READ-ONLY PHASE BEGIN ===\n'
          printf 'phase_begin_utc=%s mode=connection+resource writes=runner-temp-only\n' "$phase_begin"

          if [ -z "${TENCENT_HOST:-}" ]; then
            prep_error="${prep_error}${prep_error:+,}TENCENT_HOST_missing"
          fi
          if [ -z "${TENCENT_SSH_USER:-}" ]; then
            prep_error="${prep_error}${prep_error:+,}TENCENT_SSH_USER_missing"
          fi
          if [ -z "${TENCENT_SSH_PORT:-}" ]; then
            prep_error="${prep_error}${prep_error:+,}TENCENT_SSH_PORT_missing"
          else
            case "$TENCENT_SSH_PORT" in
              *[!0-9]*)
                prep_error="${prep_error}${prep_error:+,}TENCENT_SSH_PORT_invalid"
                ;;
              *)
                if [ "${#TENCENT_SSH_PORT}" -gt 5 ]; then
                  prep_error="${prep_error}${prep_error:+,}TENCENT_SSH_PORT_invalid"
                else
                  port=$((10#$TENCENT_SSH_PORT))
                  if [ "$port" -lt 1 ] || [ "$port" -gt 65535 ]; then
                    prep_error="${prep_error}${prep_error:+,}TENCENT_SSH_PORT_invalid"
                  fi
                fi
                ;;
            esac
          fi
          if [ -z "${TENCENT_SSH_KEY:-}" ]; then
            prep_error="${prep_error}${prep_error:+,}TENCENT_SSH_KEY_missing"
          fi
          if [ -z "${TENCENT_KNOWN_HOSTS:-}" ]; then
            prep_error="${prep_error}${prep_error:+,}TENCENT_KNOWN_HOSTS_missing"
          fi

          if [ -z "$prep_error" ]; then
            printf '%s\n' "$TENCENT_SSH_KEY" | tr -d '\r' > "$key"
            chmod 600 "$key"
            printf '%s\n' "$TENCENT_KNOWN_HOSTS" | tr -d '\r' > "$known"
            chmod 600 "$known"
            if [ ! -s "$key" ] || [ ! -s "$known" ]; then
              prep_error="ssh_material_empty"
            fi
          fi

          if [ -z "$prep_error" ]; then
            host_key_name="$TENCENT_HOST"
            if [ "$port" -ne 22 ]; then
              host_key_name="[$TENCENT_HOST]:$port"
            fi
            if ! ssh-keygen -F "$host_key_name" -f "$known" >/dev/null 2>&1; then
              prep_error="pinned_host_key_missing"
            fi
          fi

          if [ -z "$prep_error" ]; then
            timeout --signal=KILL 90s \
              ssh -F /dev/null \
                -i "$key" \
                -p "$port" \
                -o BatchMode=yes \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$known" \
                -o GlobalKnownHostsFile=/dev/null \
                -o ConnectTimeout=12 \
                -o ConnectionAttempts=1 \
                -o ServerAliveInterval=10 \
                -o ServerAliveCountMax=2 \
                -o PreferredAuthentications=publickey \
                -o PasswordAuthentication=no \
                -o KbdInteractiveAuthentication=no \
                -o UpdateHostKeys=no \
                -o LogLevel=ERROR \
                "$TENCENT_SSH_USER@$TENCENT_HOST" \
                'bash -s' \
              <<'REMOTE' >"$stdout" 2>"$stderr"
          set -u
          export LC_ALL=C

          checks=0
          failures=0
          failed_checks=""

          record_status() {
            local label="$1" status="$2"
            printf 'exit=%s\n' "$status"
            checks=$((checks + 1))
            if [ "$status" -ne 0 ]; then
              failures=$((failures + 1))
              if [ -n "$failed_checks" ]; then
                failed_checks="$failed_checks,$label"
              else
                failed_checks="$label"
              fi
            fi
          }

          run_check() {
            local label="$1" status
            shift
            printf '\n[%s]\n' "$label"
            "$@" 2>&1
            status=$?
            record_status "$label" "$status"
            return 0
          }

          printf '[connection]\nssh_connection=established\n'

          run_check sudo_noninteractive sudo -n true
          run_check utc_date date -u
          run_check hostname hostname
          run_check repo_path test -d /opt/dy-dashboard/repo
          run_check disk_df df -B1 /opt/dy-dashboard
          run_check memory_free free -m
          run_check docker_info_version sudo -n docker info --format 'docker_server_version={{.ServerVersion}}'
          run_check docker_ps sudo -n docker ps --format 'name={{.Names}} image={{.Image}} status={{.Status}}'
          run_check docker_stats sudo -n docker stats --no-stream --format 'name={{.Name}} memory={{.MemUsage}} cpu={{.CPUPerc}}'

          printf '\n[last_deploy_selected]\n'
          sudo -n python3 - <<'PY'
          import json
          path = "/opt/dy-dashboard/logs/last-deploy.json"
          keys = ("ts", "sha", "environment", "worker_started", "browser_acceptance")
          try:
              with open(path, "r", encoding="utf-8") as handle:
                  record = json.load(handle)
              selected = {key: record.get(key) for key in keys}
              print(json.dumps(selected, sort_keys=True, separators=(",", ":")))
          except Exception as exc:
              print(json.dumps({"last_deploy_error": type(exc).__name__}, sort_keys=True))
              raise SystemExit(1)
          PY
          last_deploy_status=$?
          record_status last_deploy_selected "$last_deploy_status"

          printf '\n[probe_summary]\n'
          printf 'checks=%s failures=%s failed_checks=%s\n' "$checks" "$failures" "${failed_checks:-none}"
          if [ "$failures" -eq 0 ]; then
            printf 'probe_status=ok\n'
            exit 0
          fi
          printf 'probe_status=degraded\n'
          exit 9
          REMOTE
            rc=$?
          fi

          if [ -n "$prep_error" ]; then
            result=setup_failure
          elif [ "$rc" -eq 0 ]; then
            result=success
          elif [ "$rc" -eq 9 ]; then
            result=degraded
          elif [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            result=timeout
          else
            result=transport_failure
          fi

          PROBE_STDOUT="$stdout" \
          PROBE_STDERR="$stderr" \
          REPORT_PATH="$report" \
          PROBE_RC="$rc" \
          PREP_ERROR="$prep_error" \
          PHASE_BEGIN="$phase_begin" \
          PROBE_RESULT="$result" \
          PROBE_DURATION="$((SECONDS - started))" \
          python3 - <<'PY'
          import os
          import re
          from datetime import datetime, timezone

          stdout_path = os.environ["PROBE_STDOUT"]
          stderr_path = os.environ["PROBE_STDERR"]
          report_path = os.environ["REPORT_PATH"]
          rc = int(os.environ["PROBE_RC"])
          prep_error = os.environ.get("PREP_ERROR", "")
          phase_begin = os.environ["PHASE_BEGIN"]
          result = os.environ["PROBE_RESULT"]
          duration = os.environ.get("PROBE_DURATION", "unknown")

          def read_limited(path, limit):
              with open(path, "rb") as handle:
                  raw = handle.read(limit + 1)
              return raw[:limit].decode("utf-8", "replace"), len(raw) > limit, len(raw)

          stdout_raw, stdout_truncated, stdout_bytes = read_limited(stdout_path, 262144)
          stderr_raw, stderr_truncated, stderr_bytes = read_limited(stderr_path, 65536)

          pem_block = re.compile(
              r"-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----.*?(?:-----END [A-Z0-9 ]*PRIVATE KEY-----|\Z)",
              re.IGNORECASE | re.DOTALL,
          )
          sanitizers = [
              (
                  re.compile(
                      r"(?i)\b([A-Z0-9_]*(?:PASSWORD|PASSWD|SECRET|TOKEN|API[_-]?KEY|ACCESS[_-]?KEY|PRIVATE[_-]?KEY|SSH_KEY)[A-Z0-9_]*)\s*[:=]\s*[^\s,;]+"
                  ),
                  r"\1=[REDACTED]",
              ),
              (
                  re.compile(r"(?i)\b(Authorization|Proxy-Authorization|Cookie|Set-Cookie)\s*:\s*[^\r\n]+"),
                  r"\1: [REDACTED]",
              ),
              (re.compile(r"(?i)\bBearer\s+[A-Za-z0-9._~+/=-]{8,}"), "Bearer [REDACTED]"),
              (
                  re.compile(r"(?i)\b([a-z][a-z0-9+.-]*://)[^/\s:@]+:[^/\s@]+@"),
                  r"\1[REDACTED]@",
              ),
              (re.compile(r"\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b"), "[REDACTED_JWT]"),
              (
                  re.compile(
                      r"\b(?:gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16}|AKID[A-Za-z0-9]{13,}|sk-[A-Za-z0-9]{20,})\b"
                  ),
                  "[REDACTED_TOKEN]",
              ),
              (
                  re.compile(
                      r"(?i)\b(?:ssh-(?:rsa|ed25519|dss)|ecdsa-sha2-nistp\d+)\s+AAAA[A-Za-z0-9+/=]{20,}"
                  ),
                  "[REDACTED_KEY_MATERIAL]",
              ),
              (
                  re.compile(r"(?i)\bpassword\s+for\s+[^:\r\n]+:\s*[^\r\n]*"),
                  "password for [REDACTED]: [REDACTED]",
              ),
          ]
          residual_secret = re.compile(
              r"(?i)(-----BEGIN [^-]*PRIVATE KEY-----|"
              r"eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.|"
              r"Authorization\s*:\s*\S|"
              r"postgres(?:ql)?(?:\+[a-z]+)?://[^@\s:]+:[^@\s*]+@|"
              r"(?:gh[pousr]_|github_pat_|xox[baprs]-|AKIA|AKID|sk-)[A-Za-z0-9_-]{8,})"
          )

          def sanitize_text(text):
              text = pem_block.sub("[REDACTED_PRIVATE_KEY]", text)
              clean = []
              for raw_line in text.splitlines():
                  line = raw_line.replace("\r", "")
                  for pattern, replacement in sanitizers:
                      line = pattern.sub(replacement, line)
                  if residual_secret.search(line):
                      line = "[REDACTED_SENSITIVE_LINE]"
                  if line.startswith("::") or line.startswith("##["):
                      line = "OUTPUT " + line
                  if len(line) > 4000:
                      line = line[:4000] + " [line truncated]"
                  clean.append(line)
              return "\n".join(clean).strip("\n")

          safe_error_patterns = [
              re.compile(
                  r"(?i)^(?:ssh:\s*)?connect to host .* port \d+: (?:connection timed out|connection refused|network is unreachable|no route to host)"
              ),
              re.compile(r"(?i)^(?:ssh:\s*)?could not resolve hostname\b"),
              re.compile(r"(?i)^host key verification failed\.?$"),
              re.compile(r"(?i)^permission denied \(publickey[^)]*\)\.?$"),
              re.compile(r"(?i)^(?:kex_exchange_identification|banner exchange):"),
              re.compile(r"(?i)^connection closed by .* port \d+$"),
              re.compile(r"(?i)^timeout, server .* not responding$"),
              re.compile(r"(?i)^client_loop: send disconnect"),
          ]

          def safe_error_lines(text):
              clean = sanitize_text(text)
              found = []
              for line in clean.splitlines():
                  stripped = line.strip()
                  if not stripped:
                      continue
                  if any(pattern.search(stripped) for pattern in safe_error_patterns):
                      found.append(stripped[:500])
                  if len(found) >= 6:
                      break
              return found

          stdout_clean = sanitize_text(stdout_raw)
          error_lines = []
          if result == "timeout":
              error_lines = ["ssh_error=overall_timeout_90s"]
          elif result == "setup_failure":
              error_lines = ["ssh_error=preflight_configuration"]
          elif rc not in (0, 9):
              error_lines = safe_error_lines(stderr_raw)
              if not error_lines:
                  error_lines = ["ssh_error=unclassified_transport_or_ssh_failure"]

          phase_end = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          report_lines = [
              "DYDATA-104 READ-ONLY RESOURCE PROBE REPORT",
              "receipt=begin",
              "phase_begin_utc=" + phase_begin,
              "phase_end_utc=" + phase_end,
              "workflow_mode=connection+resource",
              "read_only=true",
              "production_mutations=false",
              "runner_temp_only=true",
              "artifact_retention_days=7",
              "overall_timeout_seconds=90",
              "probe_result=" + result,
              "ssh_exit_code=" + str(rc),
              "duration_seconds=" + str(duration),
              "preflight_error=" + (prep_error or "none"),
              "stdout_bytes_captured=" + str(stdout_bytes),
              "stdout_truncated=" + str(stdout_truncated).lower(),
              "stderr_bytes_captured=" + str(stderr_bytes),
              "stderr_truncated=" + str(stderr_truncated).lower(),
              "masking=regex_fail_closed",
              "scope=connection,host,repo_path,disk,memory,docker_version,container_inventory,container_stats,last_deploy_whitelist",
              "excluded=scp,application_probe,env_inspect,production_file_write,restart,update,deploy,cancel,sql",
              "",
              "--- remote stdout (sanitized) ---",
              stdout_clean if stdout_clean else "(empty)",
          ]
          if error_lines:
              report_lines.extend(["", "--- safe ssh error (sanitized) ---", *error_lines])
          report_lines.extend(
              [
                  "",
                  "receipt=end",
                  "result=" + result,
                  "phase_end_utc=" + phase_end,
                  "",
              ]
          )
          with open(report_path, "w", encoding="utf-8", newline="\n") as handle:
              handle.write("\n".join(report_lines))
          PY

          report_failed=0
          if [ ! -s "$report" ]; then
            printf 'DYDATA-104 READ-ONLY RESOURCE PROBE REPORT\nreceipt=begin\nprobe_result=report_generation_failure\nssh_exit_code=%s\nreceipt=end\n' "$rc" > "$report"
            report_failed=1
          fi

          cat "$report"
          printf '\n=== DYDATA-104 READ-ONLY PHASE END ===\n'
          printf 'phase_end_utc=%s result=%s ssh_exit_code=%s duration_seconds=%s\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$result" "$rc" "$((SECONDS - started))"

          rm -f "$key" "$known"

          if [ "$rc" -eq 0 ] && [ "$report_failed" -eq 0 ]; then
            exit 0
          fi
          exit 1

      - name: Probe August/September head gaps and recovery budgets (read-only)
        id: head_days
        env:
          TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
          TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
          PROBE_ID: r0-head-day-gaps-recovery
          PROBE_SCRIPT: ops-preparation/recovery_r0_head_days.py
          PROBE_OUTPUT: head-days.json
          EXPECTED_SOURCE_SHA256: 9bb154c257f37629999368fb2b6f21e87c292b741b8c5fd7a7b7e8074838db72
        run: |
          set -uo pipefail
          set +e
          umask 077

          work="$RUNNER_TEMP/dydata104-r0"
          private="$work/head-days.private"
          install -m 700 -d "$work" "$private"
          stdout="$private/probe.stdout"
          stderr="$private/probe.stderr"
          key="$private/ssh_key"
          known="$private/known_hosts"
          out="$work/$PROBE_OUTPUT"
          : > "$stdout"
          : > "$stderr"
          rm -f "$out"
          trap 'rm -f "$key" "$known"; rm -rf "$private"' EXIT

          shaExpected="$EXPECTED_SOURCE_SHA256"
          shaActual="$(sha256sum "$PROBE_SCRIPT" | awk '{print $1}')"
          shaMatch=false
          if [ -n "$shaActual" ] && [ "$shaActual" = "$shaExpected" ]; then
            shaMatch=true
          fi
          printf 'source_check_receipt probe=%s source_sha256=%s expected_sha256=%s source_hash_match=%s\n' \
            "$PROBE_ID" "${shaActual:-missing}" "$shaExpected" "$shaMatch"
          if [ "$shaMatch" != true ]; then
            printf 'probe=%s source_check=failed\n' "$PROBE_ID"
            exit 1
          fi
          printf 'probe=%s source_check=passed source_sha256=%s\n' "$PROBE_ID" "$shaActual" >> "$GITHUB_STEP_SUMMARY"

          prep_error=""
          if [ -z "${TENCENT_HOST:-}" ]; then
            prep_error="${prep_error}${prep_error:+,}TENCENT_HOST_missing"
          fi
          if [ -z "${TENCENT_SSH_USER:-}" ]; then
            prep_error="${prep_error}${prep_error:+,}TENCENT_SSH_USER_missing"
          fi
          if [ -z "${TENCENT_SSH_PORT:-}" ]; then
            prep_error="${prep_error}${prep_error:+,}TENCENT_SSH_PORT_missing"
          fi
          port=0
          if [ -n "${TENCENT_SSH_PORT:-}" ]; then
            case "$TENCENT_SSH_PORT" in
              *[!0-9]*)
                prep_error="${prep_error}${prep_error:+,}TENCENT_SSH_PORT_invalid"
                ;;
              *)
                if [ "${#TENCENT_SSH_PORT}" -gt 5 ]; then
                  prep_error="${prep_error}${prep_error:+,}TENCENT_SSH_PORT_invalid"
                else
                  port=$((10#$TENCENT_SSH_PORT))
                  if [ "$port" -lt 1 ] || [ "$port" -gt 65535 ]; then
                    prep_error="${prep_error}${prep_error:+,}TENCENT_SSH_PORT_invalid"
                  fi
                fi
                ;;
            esac
          fi
          if [ -z "${TENCENT_SSH_KEY:-}" ]; then
            prep_error="${prep_error}${prep_error:+,}TENCENT_SSH_KEY_missing"
          fi
          if [ -z "${TENCENT_KNOWN_HOSTS:-}" ]; then
            prep_error="${prep_error}${prep_error:+,}TENCENT_KNOWN_HOSTS_missing"
          fi

          if [ -z "$prep_error" ]; then
            printf '%s\n' "$TENCENT_SSH_KEY" | tr -d '\r' > "$key"
            printf '%s\n' "$TENCENT_KNOWN_HOSTS" | tr -d '\r' > "$known"
            chmod 600 "$key" "$known"
            if [ ! -s "$key" ] || [ ! -s "$known" ]; then
              prep_error="ssh_material_empty"
            fi
          fi
          if [ -z "$prep_error" ]; then
            host_key_name="$TENCENT_HOST"
            if [ "$port" -ne 22 ]; then
              host_key_name="[$TENCENT_HOST]:$port"
            fi
            if ! ssh-keygen -F "$host_key_name" -f "$known" >/dev/null 2>&1; then
              prep_error="pinned_host_key_missing"
            fi
          fi
          if [ -n "$prep_error" ]; then
            printf 'probe=%s validation=failed error=preflight_%s\n' "$PROBE_ID" "$prep_error"
            exit 1
          fi

          rc=78
          timeout --signal=KILL 90s \
            ssh -F /dev/null \
              -i "$key" \
              -p "$port" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$known" \
              -o GlobalKnownHostsFile=/dev/null \
              -o ConnectTimeout=12 \
              -o ConnectionAttempts=1 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=2 \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o LogLevel=ERROR \
              "$TENCENT_SSH_USER@$TENCENT_HOST" \
              'cd /opt/dy-dashboard/repo && sudo -n docker compose --env-file /opt/dy-dashboard/env/production.env -f deploy/compose.yaml exec -T -e PYTHONDONTWRITEBYTECODE=1 worker python - --confirm-read-only' \
            < "$PROBE_SCRIPT" >"$stdout" 2>"$stderr"
          rc=$?
          if [ "$rc" -ne 0 ]; then
            printf 'probe=%s validation=failed error=ssh_or_remote_failure ssh_exit_code=%s\n' "$PROBE_ID" "$rc"
            exit 1
          fi

          SSH_EXIT_CODE="$rc" PROBE_ID="$PROBE_ID" python3 - "$stdout" "$out" <<'PY'
          import json
          import os
          import re
          import sys

          stdout_path, output_path = sys.argv[1], sys.argv[2]
          probe_id = os.environ["PROBE_ID"]
          max_bytes = 262144

          def reject(code):
              print("validation_error=" + code)
              raise SystemExit(1)

          try:
              size = os.path.getsize(stdout_path)
          except OSError:
              reject("response_unreadable")
          if size > max_bytes:
              reject("response_oversize")
          try:
              with open(stdout_path, "rb") as handle:
                  raw = handle.read(max_bytes + 1)
              if len(raw) > max_bytes:
                  reject("response_oversize")
              text = raw.decode("utf-8")
          except (OSError, UnicodeDecodeError):
              reject("response_unreadable")

          credential = re.compile(
              r"(?i)(-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----|"
              r"postgres(?:ql)?(?:\+[a-z0-9]+)?://[^@\s:]+:[^@\s]+@|"
              r"\b(?:password|passwd|secret|token|api[_-]?key|access[_-]?key|private[_-]?key)\b\s*[:=]\s*[^\s,}\]]+|"
              r"\b(?:authorization|cookie|set-cookie)\s*:\s*\S|"
              r"\bBearer\s+[A-Za-z0-9._~+/=-]{8,}|"
              r"\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b|"
              r"\b(?:gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16}|AKID[A-Za-z0-9]{13,}|sk-[A-Za-z0-9]{20,})\b|"
              r"\b(?:ssh-(?:rsa|ed25519|dss)|ecdsa-sha2-nistp\d+)\s+AAAA[A-Za-z0-9+/=]{20,})"
          )
          if credential.search(text):
              reject("credential_material")

          try:
              payload = json.loads(text)
          except json.JSONDecodeError:
              reject("invalid_json")
          if not isinstance(payload, dict):
              reject("not_json_object")
          if "error" in payload:
              reject("probe_error")
          if payload.get("probe") != probe_id:
              reject("unexpected_probe")
          if payload.get("read_only_enforced") is not True:
              reject("read_only_not_enforced")
          settings = payload.get("settings")
          if not isinstance(settings, dict):
              reject("settings_missing")
          if str(settings.get("transaction_read_only", "")).strip().lower() != "on":
              reject("transaction_read_only_not_on")
          if str(settings.get("default_transaction_read_only", "")).strip().lower() != "on":
              reject("default_transaction_read_only_not_on")
          isolation = str(settings.get("transaction_isolation", "")).strip().lower().replace("_", " ")
          if isolation != "repeatable read":
              reject("isolation_not_repeatable_read")

          try:
              rendered = json.dumps(payload, ensure_ascii=False, indent=2) + "\n"
              with open(output_path, "w", encoding="utf-8", newline="\n") as handle:
                  handle.write(rendered)
          except (OSError, TypeError, ValueError):
              reject("validated_write_failed")
          PY
          vrc=$?
          if [ "$vrc" -ne 0 ]; then
            rm -f "$out"
            printf 'probe=%s validation=failed error=response_rejected ssh_exit_code=%s validator_exit_code=%s\n' "$PROBE_ID" "$rc" "$vrc"
            exit 1
          fi
          printf 'probe=%s validation=passed ssh_exit_code=%s output=%s\n' "$PROBE_ID" "$rc" "$PROBE_OUTPUT"
          printf 'probe=%s validation=passed\n' "$PROBE_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Probe August/September fee reconciliation (read-only)
        id: fees
        env:
          TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
          TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
          PROBE_ID: r0-fee-reconciliation
          PROBE_SCRIPT: ops-preparation/recovery_r0_fees.py
          PROBE_OUTPUT: fees.json
          EXPECTED_SOURCE_SHA256: c585016d078a2c3667fbcf90baba01e87a40c514c00a76b9cc3d634bce26356e
        run: |
          set -uo pipefail
          set +e
          umask 077

          work="$RUNNER_TEMP/dydata104-r0"
          private="$work/fees.private"
          install -m 700 -d "$work" "$private"
          stdout="$private/probe.stdout"
          stderr="$private/probe.stderr"
          key="$private/ssh_key"
          known="$private/known_hosts"
          out="$work/$PROBE_OUTPUT"
          : > "$stdout"
          : > "$stderr"
          rm -f "$out"
          trap 'rm -f "$key" "$known"; rm -rf "$private"' EXIT

          shaExpected="$EXPECTED_SOURCE_SHA256"
          shaActual="$(sha256sum "$PROBE_SCRIPT" | awk '{print $1}')"
          shaMatch=false
          if [ -n "$shaActual" ] && [ "$shaActual" = "$shaExpected" ]; then
            shaMatch=true
          fi
          printf 'source_check_receipt probe=%s source_sha256=%s expected_sha256=%s source_hash_match=%s\n' \
            "$PROBE_ID" "${shaActual:-missing}" "$shaExpected" "$shaMatch"
          if [ "$shaMatch" != true ]; then
            printf 'probe=%s source_check=failed\n' "$PROBE_ID"
            exit 1
          fi
          printf 'probe=%s source_check=passed source_sha256=%s\n' "$PROBE_ID" "$shaActual" >> "$GITHUB_STEP_SUMMARY"

          prep_error=""
          if [ -z "${TENCENT_HOST:-}" ]; then
            prep_error="${prep_error}${prep_error:+,}TENCENT_HOST_missing"
          fi
          if [ -z "${TENCENT_SSH_USER:-}" ]; then
            prep_error="${prep_error}${prep_error:+,}TENCENT_SSH_USER_missing"
          fi
          if [ -z "${TENCENT_SSH_PORT:-}" ]; then
            prep_error="${prep_error}${prep_error:+,}TENCENT_SSH_PORT_missing"
          fi
          port=0
          if [ -n "${TENCENT_SSH_PORT:-}" ]; then
            case "$TENCENT_SSH_PORT" in
              *[!0-9]*)
                prep_error="${prep_error}${prep_error:+,}TENCENT_SSH_PORT_invalid"
                ;;
              *)
                if [ "${#TENCENT_SSH_PORT}" -gt 5 ]; then
                  prep_error="${prep_error}${prep_error:+,}TENCENT_SSH_PORT_invalid"
                else
                  port=$((10#$TENCENT_SSH_PORT))
                  if [ "$port" -lt 1 ] || [ "$port" -gt 65535 ]; then
                    prep_error="${prep_error}${prep_error:+,}TENCENT_SSH_PORT_invalid"
                  fi
                fi
                ;;
            esac
          fi
          if [ -z "${TENCENT_SSH_KEY:-}" ]; then
            prep_error="${prep_error}${prep_error:+,}TENCENT_SSH_KEY_missing"
          fi
          if [ -z "${TENCENT_KNOWN_HOSTS:-}" ]; then
            prep_error="${prep_error}${prep_error:+,}TENCENT_KNOWN_HOSTS_missing"
          fi

          if [ -z "$prep_error" ]; then
            printf '%s\n' "$TENCENT_SSH_KEY" | tr -d '\r' > "$key"
            printf '%s\n' "$TENCENT_KNOWN_HOSTS" | tr -d '\r' > "$known"
            chmod 600 "$key" "$known"
            if [ ! -s "$key" ] || [ ! -s "$known" ]; then
              prep_error="ssh_material_empty"
            fi
          fi
          if [ -z "$prep_error" ]; then
            host_key_name="$TENCENT_HOST"
            if [ "$port" -ne 22 ]; then
              host_key_name="[$TENCENT_HOST]:$port"
            fi
            if ! ssh-keygen -F "$host_key_name" -f "$known" >/dev/null 2>&1; then
              prep_error="pinned_host_key_missing"
            fi
          fi
          if [ -n "$prep_error" ]; then
            printf 'probe=%s validation=failed error=preflight_%s\n' "$PROBE_ID" "$prep_error"
            exit 1
          fi

          rc=78
          timeout --signal=KILL 90s \
            ssh -F /dev/null \
              -i "$key" \
              -p "$port" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$known" \
              -o GlobalKnownHostsFile=/dev/null \
              -o ConnectTimeout=12 \
              -o ConnectionAttempts=1 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=2 \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o LogLevel=ERROR \
              "$TENCENT_SSH_USER@$TENCENT_HOST" \
              'cd /opt/dy-dashboard/repo && sudo -n docker compose --env-file /opt/dy-dashboard/env/production.env -f deploy/compose.yaml exec -T -e PYTHONDONTWRITEBYTECODE=1 worker python - --confirm-read-only' \
            < "$PROBE_SCRIPT" >"$stdout" 2>"$stderr"
          rc=$?
          if [ "$rc" -ne 0 ]; then
            printf 'probe=%s validation=failed error=ssh_or_remote_failure ssh_exit_code=%s\n' "$PROBE_ID" "$rc"
            exit 1
          fi

          SSH_EXIT_CODE="$rc" PROBE_ID="$PROBE_ID" python3 - "$stdout" "$out" <<'PY'
          import json
          import os
          import re
          import sys

          stdout_path, output_path = sys.argv[1], sys.argv[2]
          probe_id = os.environ["PROBE_ID"]
          max_bytes = 262144

          def reject(code):
              print("validation_error=" + code)
              raise SystemExit(1)

          try:
              size = os.path.getsize(stdout_path)
          except OSError:
              reject("response_unreadable")
          if size > max_bytes:
              reject("response_oversize")
          try:
              with open(stdout_path, "rb") as handle:
                  raw = handle.read(max_bytes + 1)
              if len(raw) > max_bytes:
                  reject("response_oversize")
              text = raw.decode("utf-8")
          except (OSError, UnicodeDecodeError):
              reject("response_unreadable")

          credential = re.compile(
              r"(?i)(-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----|"
              r"postgres(?:ql)?(?:\+[a-z0-9]+)?://[^@\s:]+:[^@\s]+@|"
              r"\b(?:password|passwd|secret|token|api[_-]?key|access[_-]?key|private[_-]?key)\b\s*[:=]\s*[^\s,}\]]+|"
              r"\b(?:authorization|cookie|set-cookie)\s*:\s*\S|"
              r"\bBearer\s+[A-Za-z0-9._~+/=-]{8,}|"
              r"\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b|"
              r"\b(?:gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16}|AKID[A-Za-z0-9]{13,}|sk-[A-Za-z0-9]{20,})\b|"
              r"\b(?:ssh-(?:rsa|ed25519|dss)|ecdsa-sha2-nistp\d+)\s+AAAA[A-Za-z0-9+/=]{20,})"
          )
          if credential.search(text):
              reject("credential_material")

          try:
              payload = json.loads(text)
          except json.JSONDecodeError:
              reject("invalid_json")
          if not isinstance(payload, dict):
              reject("not_json_object")
          if "error" in payload:
              reject("probe_error")
          if payload.get("probe") != probe_id:
              reject("unexpected_probe")
          if payload.get("read_only_enforced") is not True:
              reject("read_only_not_enforced")
          settings = payload.get("settings")
          if not isinstance(settings, dict):
              reject("settings_missing")
          if str(settings.get("transaction_read_only", "")).strip().lower() != "on":
              reject("transaction_read_only_not_on")
          if str(settings.get("default_transaction_read_only", "")).strip().lower() != "on":
              reject("default_transaction_read_only_not_on")
          isolation = str(settings.get("transaction_isolation", "")).strip().lower().replace("_", " ")
          if isolation != "repeatable read":
              reject("isolation_not_repeatable_read")

          try:
              rendered = json.dumps(payload, ensure_ascii=False, indent=2) + "\n"
              with open(output_path, "w", encoding="utf-8", newline="\n") as handle:
                  handle.write(rendered)
          except (OSError, TypeError, ValueError):
              reject("validated_write_failed")
          PY
          vrc=$?
          if [ "$vrc" -ne 0 ]; then
            rm -f "$out"
            printf 'probe=%s validation=failed error=response_rejected ssh_exit_code=%s validator_exit_code=%s\n' "$PROBE_ID" "$rc" "$vrc"
            exit 1
          fi
          printf 'probe=%s validation=passed ssh_exit_code=%s output=%s\n' "$PROBE_ID" "$rc" "$PROBE_OUTPUT"
          printf 'probe=%s validation=passed\n' "$PROBE_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Check sanitized report
        id: report_check
        if: always()
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/dydata104-r0/report.txt"
          if [ -s "$report" ]; then
            printf 'report_exists=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'report_exists=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload validated read-only outputs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dydata-104-readonly-resource-probe
          path: |
            ${{ runner.temp }}/dydata104-r0/head-days.json
            ${{ runner.temp }}/dydata104-r0/fees.json
            ${{ runner.temp }}/dydata104-r0/report.txt
          if-no-files-found: error
          retention-days: 7
