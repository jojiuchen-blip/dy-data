name: Tencent login read-only diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_SSH_PORT: ${{ vars.TENCENT_SSH_PORT }}
      TENCENT_SSH_USER: ${{ vars.TENCENT_SSH_USER }}
      TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
      TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent_lighthouse
          chmod 600 ~/.ssh/tencent_lighthouse
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Read-only server diagnosis
        run: |
          ssh -i ~/.ssh/tencent_lighthouse -p "${TENCENT_SSH_PORT:-22}" -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=5 "$TENCENT_SSH_USER@$TENCENT_HOST" 'bash -s' <<'REMOTE'
          set -eu
          cd /opt/dy-dashboard/repo
          c() { sudo docker compose --env-file /opt/dy-dashboard/env/production.env -f deploy/compose.yaml "$@"; }
          date -u
          df -h / /opt
          free -m
          c ps
          sudo docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}} {{.PIDs}}'
          c logs --since 40m --tail 1500 api 2>&1 | python3 -c 'import sys,re; lines=sys.stdin.read().splitlines(); safe=[re.sub(r"https?://\S+|postgresql[^ ]*", "[redacted-url]",x) for x in lines if re.search(r"Error:|Exception:|TimeoutError|FATAL:|File .*, line|auth/login|connection pool|remaining connection|too many clients|could not|Traceback",x) and not re.search(r"parameters:|password|token|secret",x,re.I)]; print("\n".join(safe[-100:]))'
          c exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "select state,wait_event_type,wait_event,count(*) from pg_stat_activity group by 1,2,3 order by 4 desc; show max_connections; select count(*) as locks from pg_locks where not granted;"'
          REMOTE
