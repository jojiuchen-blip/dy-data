name: Tencent Lighthouse Deploy

# Isolated operational ref. Cleans unused builder cache only; validates
# unchanged containers, rollback image tags and volume inventory.
# Does not deploy or write application/database/backup data.

"on":
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: tencent-lighthouse-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    name: DYDATA-102/103 scoped dangling build cache maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_SSH_PORT: ${{ vars.TENCENT_SSH_PORT }}
      TENCENT_SSH_USER: ${{ vars.TENCENT_SSH_USER }}
      TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
      TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
    steps:
      - name: Check required settings
        run: |
          for name in TENCENT_HOST TENCENT_SSH_USER TENCENT_SSH_KEY TENCENT_KNOWN_HOSTS; do
            [ -n "${!name}" ] || { echo "::error::$name is not configured"; exit 1; }
          done
      # The pinned host key is mandatory: StrictHostKeyChecking keeps its secure
      # default and a mismatch fails the job instead of being accepted.
      - name: Configure SSH with pinned host key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent_lighthouse
          chmod 600 ~/.ssh/tencent_lighthouse
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$TENCENT_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || { echo "::error::pinned host key does not cover TENCENT_HOST"; exit 1; }
      - name: Collect masked read-only evidence
        run: |
          ssh -i ~/.ssh/tencent_lighthouse -p "${TENCENT_SSH_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=5 \
            "$TENCENT_SSH_USER@$TENCENT_HOST" 'bash -s' <<'REMOTE' > "$RUNNER_TEMP/report.txt"
          set -euo pipefail
          cd /opt/dy-dashboard/repo
          compose() { sudo docker compose --env-file /opt/dy-dashboard/env/production.env -f deploy/compose.yaml "$@"; }
          for service in api worker postgres; do
            container="$(compose ps -q "$service")"
            test -n "$container"
            sudo docker inspect --format '{{.Id}} name={{.Name}} started_at={{.State.StartedAt}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}}' "$container"
            if [ "$service" != postgres ]; then
              sudo docker exec "$container" sha256sum /app/apps/worker/projection_lineage.py /app/apps/worker/settlement.py
            fi
            sudo docker stats --no-stream --format '{{.Name}} memory={{.MemUsage}} percent={{.MemPerc}} cpu={{.CPUPerc}}' "$container"
            sudo docker exec "$container" sh -c 'if test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events; fi'
          done
          printf 'server_historical_git_head_not_deploy_revision='
          git rev-parse HEAD
          python3 -c 'import json; r=json.load(open("/opt/dy-dashboard/logs/last-deploy.json")); print(json.dumps({"completed_deployment":{k:r.get(k) for k in ("ts","sha","environment","worker_started")}},sort_keys=True))'
          curl --fail --silent --show-error --max-time 15 --output /dev/null --write-out 'public_http_status=%{http_code}\n' https://dy-business-engine.com/finance/promotion
          compose exec -T worker python - <<'PY'
          import json,hashlib
          from sqlalchemy import select,func,text,literal
          from dy_api import models as M
          from dy_api.pdca_readonly_access import _open_pdca_readonly_session
          scope=_open_pdca_readonly_session()
          session=next(scope)
          try:
              assert session.scalar(text('SHOW transaction_read_only'))=='on'
              def fact_hash(model,predicate):
                  rows=session.execute(select(*model.__table__.c).where(predicate)).mappings().all()
                  values=sorted(json.dumps(dict(row),sort_keys=True,default=str,separators=(',',':')) for row in rows)
                  return {'rows':len(values),'sha256':hashlib.sha256('\n'.join(values).encode()).hexdigest()}
              august_statements=select(M.SettlementStatement.statement_id).where(M.SettlementStatement.statement_month=='2026-08')
              facts={
                  'settlement_fee_result':fact_hash(M.SettlementFeeResult,M.SettlementFeeResult.original_business_month=='2026-08'),
                  'settlement_fee_adjustment':fact_hash(M.SettlementFeeAdjustment,M.SettlementFeeAdjustment.original_business_month=='2026-08'),
                  'settlement_statement':fact_hash(M.SettlementStatement,M.SettlementStatement.statement_month=='2026-08'),
                  'settlement_statement_entry':fact_hash(M.SettlementStatementEntry,M.SettlementStatementEntry.statement_id.in_(august_statements)),
                  'settlement_statement_confirmation':fact_hash(M.SettlementStatementConfirmation,M.SettlementStatementConfirmation.statement_id.in_(august_statements)),
                  'settlement_scope_rule':fact_hash(M.SettlementScopeRule,M.SettlementScopeRule.effective_month=='2026-08'),
                  'sku_fee_rule':fact_hash(M.SkuFeeRule,text('TRUE')),
              }
              active=session.get(M.SettlementProjectionActive,'settlement')
              head=session.get(M.SettlementProjectionGeneration,active.generation_id) if active and active.generation_id else None
              if head is not None:
                  G=M.SettlementProjectionGeneration
                  chain=select(G.generation_id,G.base_generation_id,literal(0).label('hop')).where(G.generation_id==head.generation_id).cte('resource_lineage',recursive=True)
                  chain=chain.union_all(select(G.generation_id,G.base_generation_id,(chain.c.hop+1).label('hop')).join(chain,G.generation_id==chain.c.base_generation_id).where(chain.c.hop<65))
                  captured=session.execute(select(chain).order_by(chain.c.hop)).mappings().all()
                  ids=[row['generation_id'] for row in captured]
                  assert 1<=len(ids)<=65 and len(set(ids))==len(ids) and captured[-1]['base_generation_id'] is None
                  manifest=M.SettlementProjectionPartitionManifest
                  partitions=select(manifest.artifact,manifest.partition_key).where(manifest.generation_id.in_(ids)).distinct().subquery()
                  print(json.dumps({'compaction_observed_resources':{'distinct_manifest_rows':session.scalar(select(func.count()).select_from(partitions)),'closure_rows':len(ids)}}))
                  negative=session.execute(select(manifest.artifact,func.count()).where(manifest.generation_id.in_(ids),manifest.amount_total_cent<0).group_by(manifest.artifact)).all()
                  print(json.dumps({'negative_manifest_amount_counts':[{'artifact':artifact,'rows':count} for artifact,count in negative]}))
                  nearest=select(manifest.artifact,manifest.partition_key,manifest.owner_state,manifest.amount_total_cent,func.row_number().over(partition_by=(manifest.artifact,manifest.partition_key),order_by=chain.c.hop).label('nearest')).join(chain,manifest.generation_id==chain.c.generation_id).subquery()
                  effective_negative=session.execute(select(nearest.c.artifact,func.count()).where(nearest.c.nearest==1,nearest.c.owner_state=='owned',nearest.c.amount_total_cent<0).group_by(nearest.c.artifact)).all()
                  print(json.dumps({'effective_negative_manifest_amount_counts':[{'artifact':artifact,'rows':count} for artifact,count in effective_negative]}))
              print(json.dumps({'august_full_fact_hashes':facts,'active_head':{'generation_id':head.generation_id,'depth':head.lineage_depth,'state':head.state,'kind':head.generation_kind} if head else None},sort_keys=True))
              rows=session.execute(select(M.SettlementScopeRule.effective_month,M.SettlementScopeRule.is_active,func.count()).where(M.SettlementScopeRule.effective_month.in_(['2026-08','2026-09','2026-10'])).group_by(M.SettlementScopeRule.effective_month,M.SettlementScopeRule.is_active)).all()
              print(json.dumps({'monthly_scope_rule_counts':[{'month':month,'active':active,'rows':count} for month,active,count in rows]}))
              jobs=list(session.scalars(select(M.JobRun).where(M.JobRun.job_name=='settlement_compaction').order_by(M.JobRun.started_at.desc()).limit(3)))
              print(json.dumps({'compaction_jobs':[{'job_id':j.job_id,'status':j.status,'attempt_count':j.attempt_count,'max_attempts':j.max_attempts,'stage':(j.metadata_json or {}).get('stage'),'result':(j.metadata_json or {}).get('result')} for j in jobs]},sort_keys=True))
              compacts=list(session.scalars(select(M.SettlementProjectionGeneration).where(M.SettlementProjectionGeneration.generation_kind=='compact').order_by(M.SettlementProjectionGeneration.created_at.desc()).limit(3)))
              print(json.dumps({'compaction_checkpoints':[{'generation_id':g.generation_id,'state':g.state,'progress':{k:(g.checkpoint_json or {}).get(k) for k in ('phase','batch_count','partition_count','source_row_count')}} for g in compacts]},sort_keys=True))
              heartbeats=list(session.scalars(select(M.ComponentHeartbeat).where(M.ComponentHeartbeat.component_type=='worker').order_by(M.ComponentHeartbeat.last_heartbeat_at.desc()).limit(5)))
              print(json.dumps({'worker_resource_guards':[{'instance':h.component_instance_id,'sampled_at':str(h.last_heartbeat_at),'guard':{k:(h.activity_json or {}).get('resource_guard',{}).get(k) for k in ('state','allow_daily','allow_history','duration_seconds','reasons')}} for h in heartbeats]},sort_keys=True))
          finally:
              scope.close()
          PY
          pg_container="$(compose ps -q postgres)"
          pg_mount="$(sudo docker inspect --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql"}}{{.Type}}|{{.Source}}{{end}}{{end}}' "$pg_container")"
          IFS='|' read -r pg_type pg_source <<< "$pg_mount"
          test "$pg_type" = volume
          test "${pg_source#/}" != "$pg_source"
          sudo test -d "$pg_source"
          printf 'pg_volume_disk_total_available_bytes='
          sudo df -B1 --output=size,avail "$pg_source" | tail -1 | xargs
          free -m
          df -B1 --output=size,avail,pcent /opt/dy-dashboard
          sudo journalctl -k --since '10 minutes ago' --no-pager | grep -Ei 'Out of memory|Killed process|oom-kill' | tail -8 || true
          REMOTE
      - name: Fail closed, then publish the masked report
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/report.txt"
          test -s "$report"
          if grep -Eqi 'BEGIN [A-Z ]*PRIVATE KEY|(Cookie|Authorization):[[:space:]]*[^ ]|postgres(ql)?(\+[a-z]+)?://[^@[:space:]]*:[^@*[:space:]]*@|eyJ[A-Za-z0-9_-]{10,}\.' "$report"; then
            echo "::error::masking gate failed: a credential-shaped value survived masking; report withheld"
            exit 1
          fi
          cat "$report"
      - name: Upload masked report
        uses: actions/upload-artifact@v4
        with:
          name: dydata-102-103-readonly-diagnosis
          path: ${{ runner.temp }}/report.txt
          if-no-files-found: error
          retention-days: 14
