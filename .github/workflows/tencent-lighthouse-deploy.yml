name: Ranking Read-only Production Diagnostics
"on":
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_SSH_PORT: ${{ vars.TENCENT_SSH_PORT }}
      TENCENT_SSH_USER: ${{ vars.TENCENT_SSH_USER }}
      TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
      TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
    steps:
      - name: Read bounded API error diagnostics
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent_lighthouse
          chmod 600 ~/.ssh/tencent_lighthouse
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/tencent_lighthouse ~/.ssh/known_hosts' EXIT
          ssh -i ~/.ssh/tencent_lighthouse -p "${TENCENT_SSH_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$TENCENT_SSH_USER@$TENCENT_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/dy-dashboard/repo
          compose() { sudo docker compose --env-file /opt/dy-dashboard/env/production.env -f deploy/compose.yaml "$@"; }
          compose ps --format '{{.Service}} {{.State}} {{.Health}}'
          compose logs --no-color --since 12h --tail 1200 api 2>&1 \
            | grep -E '(Traceback|File "/app/.*ranking_|sqlalchemy.exc.|psycopg.errors.|TimeoutError|TypeError|AttributeError|UndefinedColumn|QueryCanceled|ProgrammingError)' \
            | tail -n 80 || true
          compose exec -T postgres sh -c 'psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
          BEGIN READ ONLY;
          SET LOCAL statement_timeout = '10000';
          EXPLAIN (ANALYZE, BUFFERS, TIMING OFF)
          WITH rules AS MATERIALIZED (SELECT sku_id, product_id FROM dim_sku_product_rules WHERE product_scope = '精诚养车'),
          products AS MATERIALIZED (SELECT sku_id AS id FROM rules UNION SELECT product_id FROM rules WHERE product_id IS NOT NULL)
          SELECT count(*) FROM clue_assignment_rounds r
          WHERE r.execution_mode = 'formal' AND r.assigned_at >= '2026-08-31 16:00:00+00' AND r.assigned_at < '2026-09-11 16:00:00+00'
          AND (EXISTS (SELECT 1 FROM raw_douyin_orders o WHERE o.order_id = r.order_id AND o.sku_id IN (SELECT sku_id FROM rules))
            OR EXISTS (SELECT 1 FROM raw_douyin_clues c WHERE c.order_id = r.order_id AND c.product_id IN (SELECT id FROM products))
            OR EXISTS (SELECT 1 FROM clue_center_orders c WHERE c.order_id = r.order_id AND c.product_id IN (SELECT id FROM products)));
          ROLLBACK;
          SQL
          REMOTE
