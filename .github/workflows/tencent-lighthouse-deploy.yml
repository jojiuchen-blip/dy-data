name: Tencent Lighthouse Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    name: Read API health after PDCA acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_SSH_PORT: ${{ vars.TENCENT_SSH_PORT }}
      TENCENT_SSH_USER: ${{ vars.TENCENT_SSH_USER }}
      TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
      TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
    steps:
      - name: Read precise image, health and memory events
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent_lighthouse
          chmod 600 ~/.ssh/tencent_lighthouse
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/tencent_lighthouse -p "${TENCENT_SSH_PORT:-22}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$TENCENT_SSH_USER@$TENCENT_HOST" 'sudo python3 -' <<'PY'
          import subprocess,json,pathlib
          def run(args):return subprocess.check_output(args,text=True).strip()
          root=pathlib.Path('/opt/dy-dashboard')
          report=json.loads((root/'logs/pdca-ranking-393e3dab.json').read_text())
          cid=run(['docker','compose','--env-file',str(root/'env/production.env'),'-f',str(root/'repo/deploy/compose.yaml'),'ps','-q','api'])
          state=json.loads(run(['docker','inspect',cid]))[0]
          events=dict(line.split() for line in run(['docker','exec',cid,'cat','/sys/fs/cgroup/memory.events']).splitlines())
          result={'service':'production-api-post-acceptance','image':state['Image'],'healthy':state['State'].get('Health',{}).get('Status'),'restart_count':state['RestartCount'],'oom_killed':state['State']['OOMKilled'],'memory_events':events,'started_at':state['State']['StartedAt']}
          print(json.dumps(result))
          assert state['Image']==report['new_image'] and result['healthy']=='healthy'
          assert result['restart_count']==0 and int(events.get('oom_kill',0))==0 and not result['oom_killed']
          PY
