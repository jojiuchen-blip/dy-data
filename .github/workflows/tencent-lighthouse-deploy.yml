name: Tencent Lighthouse Deploy
"on":
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tencent-lighthouse-refs/heads/main
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_SSH_USER: ${{ vars.TENCENT_SSH_USER }}
      TENCENT_SSH_PORT: ${{ vars.TENCENT_SSH_PORT }}
      TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
      TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
    steps:
      - name: Inspect current web deployment without changing services
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent_lighthouse
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/tencent_lighthouse ~/.ssh/known_hosts
          ssh -i ~/.ssh/tencent_lighthouse -p "${TENCENT_SSH_PORT:-22}" -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 "$TENCENT_SSH_USER@$TENCENT_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/dy-dashboard/repo
          sudo docker ps --format '{{.Names}} {{.Image}} {{.Status}}'
          sudo docker ps -q --filter label=com.docker.compose.service=web | while read -r id; do
            sudo docker inspect --format '{{.Image}} {{index .Config.Labels "com.docker.compose.project.config_files"}} {{index .Config.Labels "com.docker.compose.project.working_dir"}}' "$id"
          done
          python3 - <<'PY'
          import json, hashlib, os
          from pathlib import Path
          p=Path('/opt/dy-dashboard/logs/last-deploy.json')
          if p.exists():
              d=json.loads(p.read_text())
              print('release',json.dumps({k:v for k,v in d.items() if k in ('sha','target_sha','web_image','web_image_id','api_image','status','browser_acceptance')}))
          for p in sorted(Path('apps/web').rglob('*')):
              if p.is_file() and not any(x in p.parts for x in ('node_modules','dist','.git')):
                  print('WEB_SOURCE',p.as_posix(),hashlib.sha256(p.read_bytes()).hexdigest())
          s=os.statvfs('/opt/dy-dashboard'); print('DISK',s.f_bavail*s.f_frsize,s.f_blocks*s.f_frsize)
          PY
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8080/ | head -c 2500
          REMOTE
