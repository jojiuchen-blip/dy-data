name: Tencent Lighthouse Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    name: Isolated 768MB ranking candidate validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_SSH_PORT: ${{ vars.TENCENT_SSH_PORT }}
      TENCENT_SSH_USER: ${{ vars.TENCENT_SSH_USER }}
      TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
      TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 393e3dab77f229840f6127e4d15fcd77939e471e
      - name: Configure pinned SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent_lighthouse
          chmod 600 ~/.ssh/tencent_lighthouse
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          scp -i ~/.ssh/tencent_lighthouse -P "${TENCENT_SSH_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes apps/api/dy_api/ranking_snapshots.py "$TENCENT_SSH_USER@$TENCENT_HOST:/tmp/pdca-ranking-393e3dab.py"
          scp -i ~/.ssh/tencent_lighthouse -P "${TENCENT_SSH_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes apps/api/dy_api/ranking_lifecycle.py "$TENCENT_SSH_USER@$TENCENT_HOST:/tmp/pdca-ranking-lifecycle-393e3dab.py"
      - name: Build isolated candidate and validate normal derived snapshot
        run: |
          ssh -i ~/.ssh/tencent_lighthouse -p "${TENCENT_SSH_PORT:-22}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$TENCENT_SSH_USER@$TENCENT_HOST" 'sudo python3 -' <<'PY'
          import subprocess,json,hashlib,os,pathlib
          def run(args,**kw): return subprocess.check_output(args,text=True,**kw).strip()
          root=pathlib.Path('/opt/dy-dashboard');repo=root/'repo';env=root/'env/production.env'
          c=['docker','compose','--env-file',str(env),'-f',str(repo/'deploy/compose.yaml')]
          assert json.loads((root/'logs/last-deploy.json').read_text())['sha']=='fe02e2a829f572cd91ed11e4815fd23a5e3504a0'
          cid=run(c+['ps','-q','api']);state=json.loads(run(['docker','inspect',cid]))[0]
          original_restarts=state['RestartCount']
          assert run(['docker','exec',cid,'sha256sum','/app/apps/api/dy_api/ranking_snapshots.py']).split()[0]=='0f1fcc5427fb1df082e0e438320e46e6b4e860824b8e713c20a42c53ef5738d4'
          assert run(['docker','exec',cid,'sha256sum','/app/apps/api/dy_api/ranking_lifecycle.py']).split()[0]=='e85cb7c05c32c79d5b0f1d3c96af2def3161d1edca80d6c53d02ff3f4162adf3'
          source=pathlib.Path('/tmp/pdca-ranking-393e3dab.py')
          assert hashlib.sha256(source.read_bytes()).hexdigest()=='38d17e1d3f5c4474e4ae53bcdc48ee26c44abc0a6ada8206c079e3b4a5d2a2bf'
          lifecycle=pathlib.Path('/tmp/pdca-ranking-lifecycle-393e3dab.py')
          assert hashlib.sha256(lifecycle.read_bytes()).hexdigest()=='999aba3e6c60613cc3d2d8800ed002cc906d9494d49f2f2273ff06794b823f1f'
          fs=os.statvfs(root);assert fs.f_bavail*fs.f_frsize>=10*1024**3 and fs.f_bavail/fs.f_blocks>=.15
          context=pathlib.Path('/tmp/pdca-ranking-393e3dab');context.mkdir(exist_ok=True)
          (context/'ranking_snapshots.py').write_bytes(source.read_bytes());os.chmod(context/'ranking_snapshots.py',0o644)
          (context/'ranking_lifecycle.py').write_bytes(lifecycle.read_bytes());os.chmod(context/'ranking_lifecycle.py',0o644)
          base='dy-dashboard-api:pdca-before-393e3dab';image='dy-dashboard-api:pdca-ranking-393e3dab'
          run(['docker','tag',state['Image'],base])
          (context/'Dockerfile').write_text('FROM '+base+'\nCOPY ranking_snapshots.py /app/apps/api/dy_api/ranking_snapshots.py\nCOPY ranking_lifecycle.py /app/apps/api/dy_api/ranking_lifecycle.py\nLABEL pdca.ranking.patch="393e3dab77f229840f6127e4d15fcd77939e471e"\n')
          subprocess.run(['docker','build','--pull=false','-t',image,str(context)],check=True,stdout=subprocess.DEVNULL)
          network=next(iter(state['NetworkSettings']['Networks']))
          program='''
          import json,resource,time,signal,sys,os
          from datetime import datetime,timezone
          from sqlalchemy import text
          from apps.api.dy_api.db import get_session_factory
          from apps.api.dy_api.ranking_business import ensure_business_snapshot
          from apps.api.dy_api.ranking_snapshots import read_snapshot_report
          signal.alarm(180); began=time.monotonic(); seen=set(); ticks=0
          class MemoryGuard(Exception): pass
          def trace(frame,event,arg):
              global ticks
              file=frame.f_code.co_filename.rsplit('/',1)[-1]; name=frame.f_code.co_name
              if file not in ('ranking_snapshots.py','ranking_lifecycle.py','clue_followup_metrics.py','ranking_business.py'): return None
              if event=='line':
                  ticks+=1
                  key=(file,name)
                  if key not in seen or ticks%10000==0:
                      rss=int(open('/proc/self/statm').read().split()[1])*os.sysconf('SC_PAGE_SIZE')//1024
                      if key not in seen or rss>600*1024:
                          print(json.dumps({'service':'candidate-memory-stage','file':file,'function':name,'line':frame.f_lineno,'rss_kb':rss,'seconds':round(time.monotonic()-began,2)}),flush=True)
                      seen.add(key)
                      if rss>620*1024:raise MemoryGuard('bounded diagnostic memory guard')
              return trace
          sys.settrace(trace)
          with get_session_factory()() as session:
              session.execute(text("SET LOCAL lock_timeout = '2s'"))
              start=datetime.fromisoformat('2026-09-01T00:00:00+08:00');end=datetime.fromisoformat('2026-10-20T00:00:00+08:00')
              run_id=ensure_business_snapshot(session,period_start=start,period_end=end)
              session.commit()
              levels={}
              for level in ('group','service_center','district','area','store'):
                  data=read_snapshot_report(session,period_start=start,period_end=end,level=level,run_id=run_id,data_mode='business',page_size=200)
                  levels[level]={'response_keys':list(data),'rows':len(data.get('rows',[]))}
              print(json.dumps({'service':'isolated-ranking-candidate','run_id':run_id,'levels':levels,'peak_rss_mb':round(resource.getrusage(resource.RUSAGE_SELF).ru_maxrss/1024,1),'seconds':round(time.monotonic()-began,2)}),flush=True)
          '''
          import textwrap
          completed=subprocess.run(['docker','run','--rm','-i','--name','pdca-ranking-candidate-393e3dab','--memory=768m','--memory-swap=768m','--network',network,'--env-file',str(env),image,'python','-'],input=textwrap.dedent(program),text=True,capture_output=True,timeout=210)
          # Whitelist JSON result; never publish raw exceptions, SQL or parameters.
          for line in completed.stdout.splitlines():
              if line.startswith('{'):
                  value=json.loads(line)
                  if value.get('service') in ('isolated-ranking-candidate','candidate-memory-stage'):print(json.dumps(value))
          after=json.loads(run(['docker','inspect',cid]))[0]
          allowed=['指标数据正在更新，请稍后刷新','榜单计算期间源数据发生变化，请稍后刷新','该期间尚未生成指标快照，请等待数据处理完成或调整日期范围','所选期间数据量超过单批计算上限，请缩短时间范围','invalid snapshot row budget','invalid period, observation cutoff or roster date','no mapping version at roster date','指标维度或汇总数据量超过处理上限，请联系管理员分批处理']
          import re
          print(json.dumps({'service':'candidate-result','exit_code':completed.returncode,'production_api_restarts_before':original_restarts,'production_api_restarts_after':after['RestartCount'],'production_api_unchanged':after['Id']==cid,'error_classes':[kind for kind in ('MemoryGuard','MemoryError','OperationalError','ValueError','IntegrityError') if kind in completed.stderr],'known_errors':[message for message in allowed if message in completed.stderr],'frames':re.findall(r'File "(/app/[^"\n]+\.py)", line ([0-9]+)',completed.stderr)}))
          assert completed.returncode==0,'Candidate did not pass; production API unchanged'
          PY
