name: Tencent Lighthouse Deploy

# Isolated operational ref. Cleans unused builder cache only; validates
# unchanged containers, rollback image tags and volume inventory.
# Does not deploy or write application/database/backup data.

"on":
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: tencent-lighthouse-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    name: DYDATA-102/103 scoped dangling build cache maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_SSH_PORT: ${{ vars.TENCENT_SSH_PORT }}
      TENCENT_SSH_USER: ${{ vars.TENCENT_SSH_USER }}
      TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
      TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
    steps:
      - name: Check required settings
        run: |
          for name in TENCENT_HOST TENCENT_SSH_USER TENCENT_SSH_KEY TENCENT_KNOWN_HOSTS; do
            [ -n "${!name}" ] || { echo "::error::$name is not configured"; exit 1; }
          done
      # The pinned host key is mandatory: StrictHostKeyChecking keeps its secure
      # default and a mismatch fails the job instead of being accepted.
      - name: Configure SSH with pinned host key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent_lighthouse
          chmod 600 ~/.ssh/tencent_lighthouse
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$TENCENT_HOST" -f ~/.ssh/known_hosts >/dev/null \
            || { echo "::error::pinned host key does not cover TENCENT_HOST"; exit 1; }
      - name: Collect masked read-only evidence
        run: |
          ssh -i ~/.ssh/tencent_lighthouse -p "${TENCENT_SSH_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=5 \
            "$TENCENT_SSH_USER@$TENCENT_HOST" 'bash -s' <<'REMOTE' > "$RUNNER_TEMP/report.txt"
          set -euo pipefail
          cd /opt/dy-dashboard/repo
          sudo docker compose --env-file /opt/dy-dashboard/env/production.env -f deploy/compose.yaml exec -T api python - <<'PY'
          import json, hashlib
          from datetime import date
          from sqlalchemy import select, text
          from dy_api import models as M
          from dy_api.pdca_readonly_access import _open_pdca_readonly_session
          from dy_api.settlement_audit_readonly import read_settlement_month_audit, read_month_close_readiness
          out={}
          gen=_open_pdca_readonly_session(); session=next(gen)
          try:
              assert session.scalar(text('SHOW transaction_read_only')) == 'on'
              out['audit']=read_settlement_month_audit(session).model_dump()
              out['readiness']=read_month_close_readiness(session).model_dump()
              dates=[date(2026,9,d) for d in (14,16,20,25,28)]
              jobs=session.scalars(select(M.JobRun).where(M.JobRun.business_date.in_(dates)).order_by(M.JobRun.business_date,M.JobRun.job_id)).all()
              out['jobs']=[{k:str(getattr(j,k)) if getattr(j,k) is not None else None for k in ('job_id','job_kind','business_date','status','parent_job_id','data_source','config_version','attempt_count','max_attempts','lease_expires_at','cancel_requested_at','pause_after_stage_requested_at')} | {'target':(j.metadata_json or {}).get('target'),'recovery_generations':(j.metadata_json or {}).get('day_recovery_generations',[])} for j in jobs]
              out['august_facts']={}
              stmts=select(M.SettlementStatement.statement_id).where(M.SettlementStatement.statement_month=='2026-08')
              for cls,cond in [(M.SettlementStatement,M.SettlementStatement.statement_month=='2026-08'),(M.SettlementFeeResult,M.SettlementFeeResult.original_business_month=='2026-08'),(M.SettlementFeeAdjustment,M.SettlementFeeAdjustment.adjustment_posting_month=='2026-08'),(M.SettlementStatementEntry,M.SettlementStatementEntry.statement_id.in_(stmts)),(M.SettlementStatementConfirmation,M.SettlementStatementConfirmation.statement_id.in_(stmts))]:
                  rows=session.execute(select(*cls.__table__.columns).where(cond)).all()
                  payload=sorted(json.dumps(list(r),default=str,sort_keys=True) for r in rows)
                  out['august_facts'][cls.__tablename__]={'rows':len(rows),'sha256':hashlib.sha256(('\n'.join(payload)).encode()).hexdigest()}
          finally:
              gen.close()
          print(json.dumps(out,default=str,sort_keys=True))
          PY
          REMOTE
      - name: Fail closed, then publish the masked report
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/report.txt"
          test -s "$report"
          if grep -Eqi 'BEGIN [A-Z ]*PRIVATE KEY|(Cookie|Authorization):[[:space:]]*[^ ]|postgres(ql)?(\+[a-z]+)?://[^@[:space:]]*:[^@*[:space:]]*@|eyJ[A-Za-z0-9_-]{10,}\.' "$report"; then
            echo "::error::masking gate failed: a credential-shaped value survived masking; report withheld"
            exit 1
          fi
          cat "$report"
      - name: Upload masked report
        uses: actions/upload-artifact@v4
        with:
          name: dydata-102-103-readonly-diagnosis
          path: ${{ runner.temp }}/report.txt
          if-no-files-found: error
          retention-days: 14
