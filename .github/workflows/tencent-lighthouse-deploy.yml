name: Tencent login disk recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_SSH_PORT: ${{ vars.TENCENT_SSH_PORT }}
      TENCENT_SSH_USER: ${{ vars.TENCENT_SSH_USER }}
      TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
      TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent_lighthouse
          chmod 600 ~/.ssh/tencent_lighthouse
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Verify restored services
        run: |
          ssh -i ~/.ssh/tencent_lighthouse -p "${TENCENT_SSH_PORT:-22}" -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=5 "$TENCENT_SSH_USER@$TENCENT_HOST" 'bash -s' <<'REMOTE'
          set -eu
          cd /opt/dy-dashboard/repo
          c() { sudo docker compose --env-file /opt/dy-dashboard/env/production.env -f deploy/compose.yaml "$@"; }
          date -u
          df -h /
          sudo python3 - <<'PY'
          import subprocess,json,datetime
          def run(args): return subprocess.check_output(args,text=True)
          used=set()
          containers=run(['docker','ps','-aq']).split()
          if containers: used={x['Image'] for x in json.loads(run(['docker','inspect',*containers]))}
          candidates=run(['docker','images','--filter','reference=dy-dashboard-*','--format','{{.ID}}']).split()
          removed=0
          for key in sorted(set(candidates)):
            item=json.loads(run(['docker','image','inspect',key]))[0]
            tags=item.get('RepoTags') or []
            if item['Id'] in used: continue
            if not tags or any(':local' in t or ':rollback' in t or ':dydata87-pre-' in t for t in tags): continue
            created=datetime.datetime.fromisoformat(item['Created'].replace('Z','+00:00'))
            if created > datetime.datetime.now(datetime.timezone.utc)-datetime.timedelta(days=7): continue
            print('Removing unused rebuildable project image:',key,flush=True)
            subprocess.run(['docker','image','rm',*tags],check=True,stdout=subprocess.DEVNULL)
            removed+=1
          print('Unused project images removed:',removed)
          PY
          df -h /
          c ps
          REMOTE
