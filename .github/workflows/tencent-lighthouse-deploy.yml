name: Tencent deployment infrastructure readback
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_SSH_PORT: ${{ vars.TENCENT_SSH_PORT }}
      TENCENT_SSH_USER: ${{ vars.TENCENT_SSH_USER }}
      TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
      TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent_lighthouse
          chmod 600 ~/.ssh/tencent_lighthouse
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Verify restored services
        run: |
          ssh -i ~/.ssh/tencent_lighthouse -p "${TENCENT_SSH_PORT:-22}" -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=5 "$TENCENT_SSH_USER@$TENCENT_HOST" 'bash -s' <<'REMOTE'
          set -eu
          cd /opt/dy-dashboard/repo
          c() { sudo docker compose --env-file /opt/dy-dashboard/env/production.env -f deploy/compose.yaml "$@"; }
          date -u
          df -h /
          if pgrep -f '[b]ash deploy/tencent/deploy.sh' >/dev/null; then echo 'Deployment script running'; else echo 'Deployment script not running'; fi
          if pgrep -f '[p]g_dump' >/dev/null; then echo 'Database backup process running'; else echo 'No database backup process running'; fi
          c ps
          sudo cat /opt/dy-dashboard/logs/last-deploy.json
          REMOTE
