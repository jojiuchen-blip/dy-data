name: Tencent Lighthouse Deploy
"on":
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: tencent-lighthouse-refs/heads/main
  cancel-in-progress: false
jobs:
  web:
    name: Release account search frontend only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_SSH_USER: ${{ vars.TENCENT_SSH_USER }}
      TENCENT_SSH_PORT: ${{ vars.TENCENT_SSH_PORT }}
      TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
      TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: release
      - name: Require successful CI and merged PR
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/runs/39215077919 > "$RUNNER_TEMP/ci.json"
          gh api repos/${{ github.repository }}/pulls/52 > "$RUNNER_TEMP/pr.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=Path(os.environ['RUNNER_TEMP']); c=json.loads((d/'ci.json').read_text()); p=json.loads((d/'pr.json').read_text())
          assert c['head_sha']=='92a8de3d279f6dd5d36805eff52579994c2531bd' and c['conclusion']=='success'
          assert p['merged'] and p['head']['sha']==c['head_sha']
          PY
      - uses: actions/checkout@v4
        with:
          ref: fe02e2a829f572cd91ed11e4815fd23a5e3504a0
          path: production
      - uses: actions/checkout@v4
        with:
          ref: 92a8de3d279f6dd5d36805eff52579994c2531bd
          path: search
      - name: Prepare exact frontend overlay
        run: |
          set -euo pipefail
          test "$(git -C production hash-object apps/web/src/pages/AdminAccountsPage.tsx)" = d3b533d0a4ab4208f362f31e2541827b3a5d5cab
          cd production
          python3 - <<'PY'
          import subprocess,hashlib,json
          from pathlib import Path
          paths=subprocess.check_output(['git','ls-files','apps/web']).decode().splitlines()
          Path('../manifest.json').write_text(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}))
          PY
          cp ../search/apps/web/src/pages/AdminAccountsPage.tsx apps/web/src/pages/AdminAccountsPage.tsx
      - name: Build frontend image on runner
        run: |
          set -euo pipefail
          docker build --build-arg NPM_CONFIG_REGISTRY=https://registry.npmjs.org -t dy-dashboard-web:account-search-92a8de3d production/apps/web
          docker save dy-dashboard-web:account-search-92a8de3d | gzip > web-image.tar.gz
          sha256sum web-image.tar.gz > image.sha256
      - name: Configure pinned SSH
        run: |
          set -euo pipefail
          test -n "$TENCENT_HOST"; test -n "$TENCENT_SSH_USER"; test -n "$TENCENT_SSH_KEY"; test -n "$TENCENT_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent_lighthouse
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/tencent_lighthouse ~/.ssh/known_hosts
      - name: Guard and deploy web only
        run: |
          set -euo pipefail
          stage="/tmp/account-search-$GITHUB_RUN_ID"
          bytes="$(stat -c %s web-image.tar.gz)"
          image=dy-dashboard-web:account-search-92a8de3d
          image_bytes="$(docker image inspect --format '{{.Size}}' "$image")"
          target="$TENCENT_SSH_USER@$TENCENT_HOST"
          opts=(-i ~/.ssh/tencent_lighthouse -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=5)
          ssh "${opts[@]}" -p "${TENCENT_SSH_PORT:-22}" "$target" "umask 077; mkdir '$stage'"
          scp "${opts[@]}" -P "${TENCENT_SSH_PORT:-22}" manifest.json image.sha256 release/ops/account-search/deploy-web.sh search/apps/web/src/pages/AdminAccountsPage.tsx "$target:$stage/"
          ssh "${opts[@]}" -p "${TENCENT_SSH_PORT:-22}" "$target" "bash '$stage/deploy-web.sh' preflight '$stage' '$image' '$bytes' '$image_bytes'"
          scp "${opts[@]}" -P "${TENCENT_SSH_PORT:-22}" web-image.tar.gz "$target:$stage/"
          ssh "${opts[@]}" -p "${TENCENT_SSH_PORT:-22}" "$target" "bash '$stage/deploy-web.sh' deploy '$stage' '$image' '$bytes' '$image_bytes'"
