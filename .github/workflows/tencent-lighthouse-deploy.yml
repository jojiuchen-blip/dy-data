name: Two-store eligibility maintenance 20261029
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [dry-run, apply]
        default: dry-run
        required: true
      previous_version:
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: ranking-eligibility-configuration-maintenance
  cancel-in-progress: false
jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODE: ${{ inputs.mode }}
      PREVIOUS: ${{ inputs.previous_version }}
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_SSH_PORT: ${{ vars.TENCENT_SSH_PORT }}
      TENCENT_SSH_USER: ${{ vars.TENCENT_SSH_USER }}
      TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
      TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
    steps:
      - name: Configure existing SSH credentials
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent_lighthouse
          chmod 600 ~/.ssh/tencent_lighthouse
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Maintain only the versioned ranking eligibility list
        run: |
          set -euo pipefail
          [[ "$MODE" == dry-run || "$MODE" == apply ]]
          [[ -z "$PREVIOUS" || "$PREVIOUS" =~ ^elig-[A-Za-z0-9-]{1,120}$ ]]
          if [[ "$MODE" == apply && -z "$PREVIOUS" ]]; then exit 2; fi
          ssh -i ~/.ssh/tencent_lighthouse -p "${TENCENT_SSH_PORT:-22}" -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=5 "$TENCENT_SSH_USER@$TENCENT_HOST" "bash -s -- '$MODE' '$PREVIOUS'" <<'REMOTE'
          set -euo pipefail
          umask 077
          mode="$1"
          previous="$2"
          if pgrep -f '[b]ash deploy/tencent/deploy.sh' >/dev/null; then echo 'Deployment active; maintenance deferred'; exit 75; fi
          cd /opt/dy-dashboard/repo
          report="/opt/dy-dashboard/logs/eligibility-remove-two-20261029-${mode}-$(date -u +%Y%m%dT%H%M%SZ).json"
          printf '%s' '' | sudo docker compose --env-file /opt/dy-dashboard/env/production.env -f deploy/compose.yaml exec -T -e ELIGIBILITY_MODE="$mode" -e EXPECTED_ELIGIBILITY_VERSION="$previous" api python -c 'import sys,base64,json; source=base64.b64decode(sys.stdin.read());
          try: exec(compile(source,"approved_eligibility_maintenance","exec"))
          except Exception as error:
              print(json.dumps({"ok":False,"error_type":type(error).__name__,"detail":str(error) if isinstance(error,ValueError) else "Operation failed; database changes rolled back"}));sys.exit(1)' | tee "$report"
          REMOTE
