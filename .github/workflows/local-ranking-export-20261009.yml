name: Authorized local ranking export 20260907-20261007
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: authorized-local-ranking-export
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_SSH_PORT: ${{ vars.TENCENT_SSH_PORT }}
      TENCENT_SSH_USER: ${{ vars.TENCENT_SSH_USER }}
      TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
      TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
    steps:
      - name: Configure existing SSH credentials
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent_lighthouse
          chmod 600 ~/.ssh/tencent_lighthouse
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Query read-only and encrypt authorized aggregates
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/ranking-aggregate.json /tmp/ranking-error.txt' EXIT
          ssh -i ~/.ssh/tencent_lighthouse -p "${TENCENT_SSH_PORT:-22}" -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=5 "$TENCENT_SSH_USER@$TENCENT_HOST" 'bash -s' > /tmp/ranking-aggregate.json 2> /tmp/ranking-error.txt <<'REMOTE' || { echo 'Read-only export failed; sensitive diagnostics withheld'; exit 1; }
          set -eu
          if pgrep -f '[b]ash deploy/tencent/deploy.sh' >/dev/null; then exit 75; fi
          cd /opt/dy-dashboard/repo
          printf '%s' '' | sudo docker compose --env-file /opt/dy-dashboard/env/production.env -f deploy/compose.yaml exec -T api python -c 'import sys,base64;exec(compile(base64.b64decode(sys.stdin.read()),"readonly_export","exec"))'
          REMOTE
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const raw=fs.readFileSync('/tmp/ranking-aggregate.json');
          const data=JSON.parse(raw); if(!data.readonly || !data.total_denominator) throw new Error('Invalid result');
          const publicKey="-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA1YAbybYpv7qSrlNqNgrN\nLj3snJnZZUZVJAn7V9FpUk0OM/c3Hp4l4d5xMTV9yIiZ2asKv7iplZ9p/yhbFdzA\nOLDr/RRUt1cUGAxDpldiTDfg1fCXBy91vid/rbGfRAIC7ecf675TSOSwUyHWYAPv\noIyIy6GhJsi+a1zKOwrg/VRlao3iZdRWvfbeP7jXAhtL1lXWiPvhGpbm5WHUDA1p\ngVVjE5qwfM/72org+fqTWCtIzQuLGP1eP6TafKb2kBXgkSMuPkRENk6USEypwEqK\nXf8ECi2O48GAvq3J0+XNiopt2I4XpEo1G5hh6Sp3dLXc6Bbt6wqC9QcvStsbGorX\nqbet5u2jPZaViw0mu+a4A4GwCKiX78tSIsry3ER4tHGaUTOtENnG5ZNlsLjc+USn\n4bcA695IJtoymXBGYIIZkmx6fg5Z2NdrEG8urz1fTi+R2kbVnsqeKxdnZWVJFvNY\nHCfqE6091ApY3EQvRy5xQ3J3rmkhFmLaGnpMADXVC+8LAgMBAAE=\n-----END PUBLIC KEY-----\n";
          const key=crypto.randomBytes(32),iv=crypto.randomBytes(12);
          const c=crypto.createCipheriv('aes-256-gcm',key,iv);
          const encrypted=Buffer.concat([c.update(raw),c.final()]);
          const payload=Buffer.from(JSON.stringify({key:crypto.publicEncrypt({key:publicKey,oaepHash:'sha256'},key).toString('base64'),iv:iv.toString('base64'),tag:c.getAuthTag().toString('base64'),data:encrypted.toString('base64')})).toString('base64');
          console.log('RANKING_ENCRYPTED_BEGIN');
          for(let i=0;i<payload.length;i+=3000) console.log('RANKING_CHUNK '+payload.slice(i,i+3000));
          console.log('RANKING_ENCRYPTED_END');
          NODE
