name: Isolated September scope transaction rehearsal

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dydata_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dydata_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: ops
      - uses: actions/checkout@v4
        with:
          ref: 5effd6efcdf28f8d04d9f79b4ba7a38a13c3ecf9
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install application dependencies
        run: python -m pip install -r app/requirements.txt
      - name: Verify atomic visibility, rollback and replay on disposable PostgreSQL
        env:
          DY_RELEASE_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_release
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/app:$GITHUB_WORKSPACE/app/apps/api:$GITHUB_WORKSPACE/app/tests"
          export DYDATA_OPS_SCOPE_SCRIPT="$GITHUB_WORKSPACE/ops/ops-preparation/september_scope_config.py"
          cd app
          python -m pytest "$GITHUB_WORKSPACE/ops/ops-preparation/test_scope_pg_acceptance.py" -q -p no:cacheprovider
