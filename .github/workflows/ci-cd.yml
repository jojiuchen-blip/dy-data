name: CI/CD

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: dy-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dydata_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dydata_release"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      settlement-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dydata_t12
          POSTGRES_PASSWORD: dydata_t12_local_only
          POSTGRES_DB: dydata_t12
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U dydata_t12 -d dydata_t12"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Select current formal delivery plan
        run: node scripts/prepare_governance_plan.mjs .

      - name: Run project governance gates
        run: |
          npm --prefix .agent/project-manager-suite run test:ai-pm
          node .agent/project-manager-suite/tools/verify-suite-lock.mjs .
          node .agent/project-manager-suite/tools/check-protocol-alignment.mjs .agent/project-manager-suite
          node .agent/project-manager-suite/tools/validate-global-files.mjs .
          node .agent/project-manager-suite/tools/route-check.mjs .

      - name: Run real PostgreSQL release gate
        env:
          DY_RELEASE_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_release
        run: python scripts/verify_postgres_release_gate.py

      - name: Run populated PostgreSQL release gate
        env:
          DY_RELEASE_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_release
        run: python scripts/verify_postgres_populated_release_gate.py

      - name: Run PostgreSQL finance import concurrency gate
        env:
          DY_RELEASE_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_release
          DY_AGENT_ENVIRONMENT: production
        run: python scripts/verify_postgres_finance_import_concurrency.py

      # Explicit gate: the normal suite skips these without the disposable PG URL.
      - name: Run PostgreSQL pending billing concurrency gate
        env:
          DY_RELEASE_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_release
        run: python -m pytest tests/test_billing_statement_generation.py tests/test_shop_poi_postgres.py -q

      - name: Verify store geography recovery on PostgreSQL
        env:
          DY_RELEASE_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_release
        run: python -m pytest tests/test_clue_geo_recovery_postgres.py -q

      - name: Verify administrator migration and concurrent account changes on PostgreSQL
        env:
          DYDATA105_AUTH_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_admin_test
        run: |
          python -c 'import psycopg; conn = psycopg.connect("host=127.0.0.1 port=5432 dbname=dydata_release user=postgres password=postgres", autocommit=True); conn.execute("CREATE DATABASE dydata_admin_test"); conn.close()'
          python -m pytest tests/test_admin_unification_postgres.py -q

      # Explicit gate: the compaction runner and day-recovery suites skip their
      # PostgreSQL cases without the disposable loopback release database.
      - name: Verify settlement maintenance, shared claims and day recovery on PostgreSQL
        env:
          DY_RELEASE_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_release
          DY_MAINTENANCE_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_release
        run: python -m pytest tests/test_settlement_compaction_runner.py tests/test_job_recovery_and_evidence.py tests/test_settlement_rebuild_heavy_slot.py tests/test_settlement_maintenance.py tests/test_product_sync_heavy_admission.py -q

      - name: Verify clue state transitions on PostgreSQL
        env:
          DYDATA_CLUE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_clue_test
          DYDATA_RANKING_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_clue_test
        run: |
          python -c 'import psycopg; conn = psycopg.connect("host=127.0.0.1 port=5432 dbname=dydata_release user=postgres password=postgres", autocommit=True); conn.execute("CREATE DATABASE dydata_clue_test"); conn.close()'
          python -m pytest -q tests/test_clue_follow_up_postgres.py tests/test_clue_filter_alignment_postgres.py tests/test_clue_bulk_filters_postgres.py tests/test_clue_projection_postgres.py tests/test_formal_allocation_runtime_postgres.py tests/test_ranking_lifecycle_postgres.py tests/test_clue_materialization_lock_wait.py

      - name: Verify static dashboard publications on PostgreSQL
        env:
          DYDATA_PUBLICATION_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_publication_test
        run: |
          python -c 'import psycopg; conn = psycopg.connect("host=127.0.0.1 port=5432 dbname=dydata_release user=postgres password=postgres", autocommit=True); conn.execute("CREATE DATABASE dydata_publication_test"); conn.close()'
          python -m pytest -q tests/test_dashboard_publications_postgres.py tests/test_dashboard_publication_*_postgres.py tests/test_dashboard_publication_migration.py tests/test_api_promotion_invoice_postgres.py tests/test_settlement_rule_patch_postgres.py tests/test_supplement_sku_catalog_postgres.py tests/test_historical_sale_attribution_postgres.py tests/test_product_sync_sku_lookup_postgres.py tests/test_catalog_type_conversion_postgres.py

      - name: Verify guarded refund replay on PostgreSQL
        env:
          DYDATA_REFUND_REPLAY_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_publication_test
        run: python -m pytest -q tests/test_refund_evidence_replay_postgres.py

      # Full pytest may skip opt-in PG cases. This gate must execute every
      # selected case, including finance concurrency and immutable month-end DDL.
      - name: Verify DYDATA-104 financial operations and month-end evidence on PostgreSQL
        timeout-minutes: 30
        env:
          DYDATA_FINANCE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_delivery_test
          DYDATA_HISTORICAL_FEE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_delivery_test
          DYDATA_PROTECTED_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_delivery_test
          DYDATA_MISSING_FEE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_delivery_test
          DYDATA_T12_TEST_DATABASE_URL: postgresql+psycopg://dydata_t12:dydata_t12_local_only@127.0.0.1:55432/dydata_t12
          DYDATA_PUBLICATION_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_publication_test
        run: |
          mkdir -p logs/ci
          python -c 'import psycopg; conn = psycopg.connect("host=127.0.0.1 port=5432 dbname=dydata_release user=postgres password=postgres", autocommit=True); conn.execute("CREATE DATABASE dydata_delivery_test"); conn.close()'
          python -m pytest -q -ra tests/test_dydata104_finance_state_matrix.py tests/test_account_qualification_postgres.py tests/test_historical_fee_correction_postgres.py tests/test_protected_billing_authority_postgres.py tests/test_product_sync_completeness_postgres.py tests/test_product_sync_sku_lookup_postgres.py tests/test_product_sync_failure_diagnostics.py tests/test_month_close_auto_bootstrap_postgres.py tests/test_missing_fee_repair_postgres.py tests/test_missing_fee_write_proof_postgres.py tests/test_settlement_verify_impact_selection.py --junitxml=logs/ci/dydata104-postgres.xml
          python -c 'import xml.etree.ElementTree as E; suites = list(E.parse("logs/ci/dydata104-postgres.xml").getroot().iter("testsuite")); assert suites and sum(int(s.get("tests", 0)) for s in suites) > 0, "DYDATA-104 PostgreSQL gate collected no tests"; assert all(int(s.get(k, 0)) == 0 for s in suites for k in ("skipped", "failures", "errors")), "DYDATA-104 PostgreSQL gate must not skip or fail selected tests"'
          python -c 'import xml.etree.ElementTree as E; cases = list(E.parse("logs/ci/dydata104-postgres.xml").getroot().iter("testcase")); executed = [c for c in cases if c.get("classname", "").endswith("test_product_sync_failure_diagnostics") and "postgres" in c.get("name", "")]; assert len(executed) == 11 and all(not any(c.find(status) is not None for status in ("skipped", "failure", "error")) for c in executed), "all eleven product failure diagnostics PostgreSQL cases must execute successfully"'
          python -c 'import xml.etree.ElementTree as E; cases = list(E.parse("logs/ci/dydata104-postgres.xml").getroot().iter("testcase")); executed = [c for c in cases if c.get("classname", "").endswith("test_settlement_verify_impact_selection") and "postgres" in c.get("name", "")]; assert len(executed) == 11 and all(not any(c.find(status) is not None for status in ("skipped", "failure", "error")) for c in executed), "all eleven verify impact PostgreSQL cases must execute successfully"'
          # The complete authority file also owns the publication-only coordinator.
          python -c 'import xml.etree.ElementTree as E; cases = list(E.parse("logs/ci/dydata104-postgres.xml").getroot().iter("testcase")); executed = {c.get("name", "") for c in cases if c.get("classname", "").endswith("test_protected_billing_authority_postgres")}; required = {"test_postgres_publication_only_complete_apply[metadata]", "test_postgres_publication_only_complete_apply[migration]", "test_postgres_publication_only_atomic_billing_rollback", "test_postgres_publication_only_refuses_existing_heavy_claim_lock"}; assert required <= executed, "publication-only coordinator PostgreSQL cases were not executed"'
          # Require both legacy modes plus concurrency and fail-closed bootstrap cases.
          python -c 'import xml.etree.ElementTree as E; cases = list(E.parse("logs/ci/dydata104-postgres.xml").getroot().iter("testcase")); executed = {c.get("name", "") for c in cases if c.get("classname", "").endswith("test_month_close_auto_bootstrap_postgres") and not any(c.find(status) is not None for status in ("skipped", "failure", "error"))}; bootstrap_required = {"test_postgres_automatic_bootstrap_rebuilds_and_publishes_real_full_month[False]", "test_postgres_automatic_bootstrap_rebuilds_and_publishes_real_full_month[True]", "test_postgres_concurrent_ticks_share_frozen_input_job_without_resetting_attempts", "test_postgres_full_without_active_rolls_back_unknown_october_aggregates", "test_postgres_unqualified_legacy_current_rolls_back_month_economics"}; assert bootstrap_required <= executed, "automatic month-close bootstrap PostgreSQL cases were not executed successfully"'
          # Require real apply/replay, rollback, drift, protection and concurrency receipts.
          python -c 'import xml.etree.ElementTree as E; cases = list(E.parse("logs/ci/dydata104-postgres.xml").getroot().iter("testcase")); executed = {c.get("name", "") for c in cases if c.get("classname", "").endswith("test_missing_fee_repair_postgres") and not any(c.find(status) is not None for status in ("skipped", "failure", "error"))}; missing_fee_required = {"test_postgres_active_source_writer_rejects[retry_wait]", "test_postgres_active_source_writer_rejects[running]", "test_postgres_all_target_protection_facts_reject[confirmation]", "test_postgres_all_target_protection_facts_reject[confirmed]", "test_postgres_all_target_protection_facts_reject[historical-lock]", "test_postgres_all_target_protection_facts_reject[invoice]", "test_postgres_all_target_protection_facts_reject[locked]", "test_postgres_all_target_protection_facts_reject[orphan-dispute]", "test_postgres_any_historical_direction_status_month_rejects[2026-08-2-False]", "test_postgres_any_historical_direction_status_month_rejects[2026-08-3-False]", "test_postgres_any_historical_direction_status_month_rejects[2026-09-1-True]", "test_postgres_apply_commit_readback_and_exact_idempotence[metadata]", "test_postgres_apply_commit_readback_and_exact_idempotence[migration]", "test_postgres_existing_source_transaction_times_out_without_writes", "test_postgres_full_dependency_drift_rejects_zero_writes[binding]", "test_postgres_full_dependency_drift_rejects_zero_writes[new-rate]", "test_postgres_full_dependency_drift_rejects_zero_writes[rate]", "test_postgres_full_dependency_drift_rejects_zero_writes[raw-order]", "test_postgres_full_dependency_drift_rejects_zero_writes[receipt]", "test_postgres_full_dependency_drift_rejects_zero_writes[scope]", "test_postgres_full_dependency_drift_rejects_zero_writes[sibling]", "test_postgres_full_dependency_drift_rejects_zero_writes[sku]", "test_postgres_full_dependency_drift_rejects_zero_writes[store-name]", "test_postgres_heavy_claim_conflict_rejects", "test_postgres_preview_select_only", "test_postgres_relation_fences_block_insert_phantoms[config]", "test_postgres_relation_fences_block_insert_phantoms[protection]", "test_postgres_relation_fences_block_insert_phantoms[raw]", "test_postgres_remaining_wall_budget_clamps_statement_timeout", "test_postgres_reviewed_batch_representative_budget_receipt[10]", "test_postgres_reviewed_batch_representative_budget_receipt[20]", "test_postgres_reviewed_batch_representative_budget_receipt[373]", "test_postgres_reviewed_batch_representative_budget_receipt[50]", "test_postgres_transaction_characteristics_and_fixed_timeouts", "test_postgres_unexpected_writer_outputs_roll_back_entire_batch[adjustment-count]", "test_postgres_unexpected_writer_outputs_roll_back_entire_batch[budget]", "test_postgres_unexpected_writer_outputs_roll_back_entire_batch[fields]", "test_postgres_unexpected_writer_outputs_roll_back_entire_batch[outside]"}; assert missing_fee_required <= executed, "missing-fee repair PostgreSQL cases were not executed successfully"'
          python -c 'import xml.etree.ElementTree as E; cases = list(E.parse("logs/ci/dydata104-postgres.xml").getroot().iter("testcase")); executed = {c.get("name", "") for c in cases if c.get("classname", "").endswith("test_missing_fee_write_proof_postgres") and not any(c.find(status) is not None for status in ("skipped", "failure", "error"))}; write_proof_required = {"test_actual_disabled_track_counts_connection_rejects", "test_database_internal_and_final_deferred_effects_reject[audit_sidecar]", "test_database_internal_and_final_deferred_effects_reject[deferred_fee]", "test_database_internal_and_final_deferred_effects_reject[nested_index]", "test_database_internal_and_final_deferred_effects_reject[nested_trigger_function]", "test_legacy_successful_audit_replays_without_rewriting_it", "test_missing_transaction_stat_result_fails_closed", "test_postcheck_seal_rejects_commit_hook_sql", "test_replay_readback_ignores_stale_unexpired_identity_map[fee]", "test_replay_readback_ignores_stale_unexpired_identity_map[audit]", "test_representative_50_coupon_large_derived_tables_receipt", "test_target_dq_delete_is_exact_and_allowed", "test_xact_counters_are_live_and_stable_across_idle_reads"}; assert write_proof_required <= executed, "missing-fee write-proof PostgreSQL cases were not executed successfully"'

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browser
        run: |
          # Bound each apt connection so one stalled mirror cannot consume the
          # complete Playwright setup budget. Keep installation fail-closed.
          printf '%s\n' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            'Acquire::Retries "2";' \
            | sudo tee /etc/apt/apt.conf.d/zzzz-codex-playwright-network >/dev/null
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            # Use the full archive for mirror-selected base packages. It also
            # publishes noble-security; apt still verifies signed metadata.
            printf '%s\n' \
              'https://archive.ubuntu.com/ubuntu' \
              | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          # Test the direct HTTPS transport rather than the runner mirror
          # redirect layer, which has continued to hang despite its sole URL.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu|g' "$source"
          done
          sudo apt-config dump | grep -E '^Acquire::(http::Timeout|https::Timeout|Retries)'
          sudo apt-config dump | grep -Fx 'Acquire::http::Timeout "30";'
          sudo apt-config dump | grep -Fx 'Acquire::https::Timeout "30";'
          sudo apt-config dump | grep -Fx 'Acquire::Retries "2";'
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out 'Ubuntu archive HTTP %{http_code} in %{time_total}s\n' \
            https://archive.ubuntu.com/ubuntu/dists/noble/InRelease
          timeout 10m python -m playwright install chromium --with-deps

      - name: Verify DYDATA-104 financial preview and operation buttons in Chromium
        timeout-minutes: 15
        run: |
          mkdir -p logs/ci
          python -m pytest -q -ra tests/test_dydata104_finance_preview_browser.py tests/test_dydata105_buttons_browser.py --junitxml=logs/ci/dydata104-finance-browser.xml
          python -c 'import xml.etree.ElementTree as E; suites = list(E.parse("logs/ci/dydata104-finance-browser.xml").getroot().iter("testsuite")); assert suites and sum(int(s.get("tests", 0)) for s in suites) > 0, "DYDATA-104 browser gate collected no tests"; assert all(int(s.get(k, 0)) == 0 for s in suites for k in ("skipped", "failures", "errors")), "DYDATA-104 browser gate must not skip or fail selected tests"'

      - name: Upload DYDATA-104 verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dydata104-verification-${{ github.job }}-${{ github.sha }}
          path: |
            logs/ci/dydata104-postgres.xml
            logs/ci/dydata104-finance-browser.xml
          if-no-files-found: warn

      - name: Run tests
        run: python -m pytest

      - name: Verify large-scope exports through Nginx
        env:
          DY_TEST_NGINX: "1"
        run: |
          docker pull nginx:1.27-alpine
          python -m pytest tests/test_dydata105_export_nginx.py -q

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

      - name: Build API Docker image
        run: docker build --build-arg PIP_INDEX_URL=https://pypi.org/simple -f apps/api/Dockerfile -t dy-dashboard-api:ci .

      - name: Smoke test built API Docker image
        env:
          DY_API_IMAGE_SMOKE_IMAGE: dy-dashboard-api:ci
        run: python -m pytest tests/test_api_image_runtime.py -q

      - name: Build Worker Docker image
        run: docker build --build-arg PIP_INDEX_URL=https://pypi.org/simple -f apps/worker/Dockerfile -t dy-dashboard-worker:ci .

      - name: Build Browser Docker image
        run: docker build --build-arg PIP_INDEX_URL=https://pypi.org/simple -f deploy/browser/Dockerfile -t dy-dashboard-browser:ci .

      - name: Verify browser image dependency compatibility
        timeout-minutes: 5
        run: |
          mkdir -p logs/ci
          docker run --rm --network none --entrypoint python3 dy-dashboard-browser:ci -c 'from importlib.metadata import version; from pathlib import Path; import PIL; from PIL import Image; assert PIL.__version__ == version("Pillow") == "13.0.0"; assert all(Path(module.__file__).resolve().is_relative_to("/usr/local/lib") for module in (PIL, Image))'
          docker run --rm --network none --entrypoint python3 -v "$PWD/tests/test_browser_image_dependency_compat.py:/tmp/test_browser_image_dependency_compat.py:ro" -v "$PWD/logs/ci:/verification" dy-dashboard-browser:ci -m pytest -q -ra -p no:cacheprovider /tmp/test_browser_image_dependency_compat.py --junitxml=/verification/dydata104-browser-image.xml
          python -c 'import xml.etree.ElementTree as E; suites = list(E.parse("logs/ci/dydata104-browser-image.xml").getroot().iter("testsuite")); assert suites and sum(int(s.get("tests", 0)) for s in suites) == 3, "browser image gate must execute exactly three tests"; assert all(int(s.get(k, 0)) == 0 for s in suites for k in ("skipped", "failures", "errors")), "browser image gate must not skip or fail selected tests"'
          python -c 'import xml.etree.ElementTree as E; cases = list(E.parse("logs/ci/dydata104-browser-image.xml").getroot().iter("testcase")); executed = {c.get("name", "") for c in cases if c.get("classname", "").endswith("test_browser_image_dependency_compat") and not any(c.find(status) is not None for status in ("skipped", "failure", "error"))}; image_required = {"test_browser_pillow_rgb_image_round_trip[PNG]", "test_browser_pillow_rgb_image_round_trip[TIFF]", "test_browser_requests_urllib3_pool_handles_regular_and_chunked_responses"}; assert image_required <= executed, "browser image compatibility cases were not executed successfully"'

      - name: Upload DYDATA-104 browser image verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dydata104-browser-image-${{ github.job }}-${{ github.sha }}
          path: logs/ci/dydata104-browser-image.xml
          if-no-files-found: warn

      - name: Build Web Docker image
        run: docker build -f apps/web/Dockerfile -t dy-dashboard-web:ci apps/web

  railway_release_gate:
    name: Railway target release gate
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.RAILWAY_DEPLOY_ENABLED == 'true'
    timeout-minutes: 30
    env:
      DY_RELEASE_POSTGRES_URL: ${{ secrets.RAILWAY_RELEASE_DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check target release prerequisites
        run: |
          if [ -z "$DY_RELEASE_POSTGRES_URL" ]; then
            echo "::error::RAILWAY_RELEASE_DATABASE_URL secret is required for the target release gate"
            exit 1
          fi
          command -v pg_dump >/dev/null || {
            echo "::error::pg_dump is required for the target release backup"
            exit 1
          }

      - name: Back up, migrate, and verify Railway PostgreSQL
        env:
          DY_RELEASE_BACKUP_FILE: dydata-pre-migrate.dump
        run: python scripts/verify_postgres_target_release.py

      - name: Upload pre-migration backup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dydata-railway-pre-migrate-backup-${{ github.sha }}
          path: dydata-pre-migrate.dump
          if-no-files-found: error

  deploy:
    name: Deploy Railway
    runs-on: ubuntu-latest
    needs: [verify, railway_release_gate]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.RAILWAY_DEPLOY_ENABLED == 'true'

    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
      RAILWAY_API_SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID }}
      RAILWAY_WORKER_SERVICE_ID: ${{ vars.RAILWAY_WORKER_SERVICE_ID }}
      RAILWAY_BROWSER_SERVICE_ID: ${{ vars.RAILWAY_BROWSER_SERVICE_ID }}
      RAILWAY_WEB_SERVICE_ID: ${{ vars.RAILWAY_WEB_SERVICE_ID }}
      RAILWAY_WEB_URL: ${{ vars.RAILWAY_WEB_URL }}

    steps:
      - name: Check required Railway settings
        run: |
          required=(
            RAILWAY_TOKEN
            RAILWAY_PROJECT_ID
            RAILWAY_ENVIRONMENT
            RAILWAY_API_SERVICE_ID
            RAILWAY_WORKER_SERVICE_ID
            RAILWAY_BROWSER_SERVICE_ID
            RAILWAY_WEB_SERVICE_ID
            RAILWAY_WEB_URL
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

      - name: Check out repository
        if: ${{ env.RAILWAY_TOKEN != '' }}
        uses: actions/checkout@v4

      - name: Set up Node for Railway CLI
        if: ${{ env.RAILWAY_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Railway CLI
        if: ${{ env.RAILWAY_TOKEN != '' }}
        run: npm install -g @railway/cli

      - name: Deploy API
        if: ${{ env.RAILWAY_TOKEN != '' }}
        id: deploy_api
        run: |
          set +e
          output="$(railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_API_SERVICE_ID" \
            --detach \
            --json \
            --message "api ${GITHUB_SHA}" 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ]; then
            echo "::error::Railway API deployment command failed"
            exit "$status"
          fi
          deployment_id="$(echo "$output" | jq -r '.deploymentId')"
          if [ -z "$deployment_id" ] || [ "$deployment_id" = "null" ]; then
            echo "::error::Railway did not return an API deployment id"
            exit 1
          fi
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Wait for API deployment
        if: ${{ env.RAILWAY_TOKEN != '' }}
        run: |
          wait_for_deployment() {
            service="$1"
            deployment_id="$2"
            for attempt in $(seq 1 60); do
              status="$(railway deployment list \
                --environment "$RAILWAY_ENVIRONMENT" \
                --service "$service" \
                --limit 20 \
                --json | jq -r --arg id "$deployment_id" '.[] | select(.id == $id) | .status' | head -n 1)"
              echo "attempt=$attempt service=$service deployment=$deployment_id status=${status:-not_found}"
              case "$status" in
                SUCCESS)
                  return 0
                  ;;
                FAILED|CRASHED|REMOVED)
                  railway logs "$deployment_id" \
                    --project "$RAILWAY_PROJECT_ID" \
                    --environment "$RAILWAY_ENVIRONMENT" \
                    --service "$service" \
                    --deployment \
                    --lines 100 || true
                  return 1
                  ;;
              esac
              sleep 10
            done
            echo "::error::Timed out waiting for Railway deployment $deployment_id"
            return 1
          }
          wait_for_deployment "$RAILWAY_API_SERVICE_ID" "${{ steps.deploy_api.outputs.deployment_id }}"

      - name: Deploy Worker
        if: ${{ env.RAILWAY_TOKEN != '' }}
        id: deploy_worker
        run: |
          set +e
          output="$(railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_WORKER_SERVICE_ID" \
            --detach \
            --json \
            --message "worker ${GITHUB_SHA}" 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ]; then
            echo "::error::Railway Worker deployment command failed"
            exit "$status"
          fi
          deployment_id="$(echo "$output" | jq -r '.deploymentId')"
          if [ -z "$deployment_id" ] || [ "$deployment_id" = "null" ]; then
            echo "::error::Railway did not return a Worker deployment id"
            exit 1
          fi
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Worker deployment
        if: ${{ env.RAILWAY_TOKEN != '' }}
        run: |
          wait_for_deployment() {
            service="$1"
            deployment_id="$2"
            for attempt in $(seq 1 60); do
              status="$(railway deployment list \
                --environment "$RAILWAY_ENVIRONMENT" \
                --service "$service" \
                --limit 20 \
                --json | jq -r --arg id "$deployment_id" '.[] | select(.id == $id) | .status' | head -n 1)"
              echo "attempt=$attempt service=$service deployment=$deployment_id status=${status:-not_found}"
              case "$status" in
                SUCCESS)
                  return 0
                  ;;
                FAILED|CRASHED|REMOVED)
                  railway logs "$deployment_id" \
                    --project "$RAILWAY_PROJECT_ID" \
                    --environment "$RAILWAY_ENVIRONMENT" \
                    --service "$service" \
                    --deployment \
                    --lines 100 || true
                  return 1
                  ;;
              esac
              sleep 10
            done
            echo "::error::Timed out waiting for Railway deployment $deployment_id"
            return 1
          }
          wait_for_deployment "$RAILWAY_WORKER_SERVICE_ID" "${{ steps.deploy_worker.outputs.deployment_id }}"

      - name: Deploy Browser
        if: ${{ env.RAILWAY_TOKEN != '' && env.RAILWAY_BROWSER_SERVICE_ID != '' }}
        id: deploy_browser
        run: |
          set +e
          output="$(railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_BROWSER_SERVICE_ID" \
            --detach \
            --json \
            --message "browser ${GITHUB_SHA}" 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ]; then
            echo "::error::Railway Browser deployment command failed"
            exit "$status"
          fi
          deployment_id="$(echo "$output" | jq -r '.deploymentId')"
          if [ -z "$deployment_id" ] || [ "$deployment_id" = "null" ]; then
            echo "::error::Railway did not return a Browser deployment id"
            exit 1
          fi
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Browser deployment
        if: ${{ env.RAILWAY_TOKEN != '' && env.RAILWAY_BROWSER_SERVICE_ID != '' }}
        run: |
          wait_for_deployment() {
            service="$1"
            deployment_id="$2"
            for attempt in $(seq 1 60); do
              status="$(railway deployment list \
                --environment "$RAILWAY_ENVIRONMENT" \
                --service "$service" \
                --limit 20 \
                --json | jq -r --arg id "$deployment_id" '.[] | select(.id == $id) | .status' | head -n 1)"
              echo "attempt=$attempt service=$service deployment=$deployment_id status=${status:-not_found}"
              case "$status" in
                SUCCESS)
                  return 0
                  ;;
                FAILED|CRASHED|REMOVED)
                  railway logs "$deployment_id" \
                    --project "$RAILWAY_PROJECT_ID" \
                    --environment "$RAILWAY_ENVIRONMENT" \
                    --service "$service" \
                    --deployment \
                    --lines 100 || true
                  return 1
                  ;;
              esac
              sleep 10
            done
            echo "::error::Timed out waiting for Railway deployment $deployment_id"
            return 1
          }
          wait_for_deployment "$RAILWAY_BROWSER_SERVICE_ID" "${{ steps.deploy_browser.outputs.deployment_id }}"

      - name: Deploy Web
        if: ${{ env.RAILWAY_TOKEN != '' }}
        id: deploy_web
        run: |
          set +e
          output="$(railway up ./apps/web \
            --path-as-root \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_WEB_SERVICE_ID" \
            --detach \
            --json \
            --message "web ${GITHUB_SHA}" 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ]; then
            echo "::error::Railway Web deployment command failed"
            exit "$status"
          fi
          deployment_id="$(echo "$output" | jq -r '.deploymentId')"
          if [ -z "$deployment_id" ] || [ "$deployment_id" = "null" ]; then
            echo "::error::Railway did not return a Web deployment id"
            exit 1
          fi
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Web deployment
        if: ${{ env.RAILWAY_TOKEN != '' }}
        run: |
          wait_for_deployment() {
            service="$1"
            deployment_id="$2"
            for attempt in $(seq 1 60); do
              status="$(railway deployment list \
                --environment "$RAILWAY_ENVIRONMENT" \
                --service "$service" \
                --limit 20 \
                --json | jq -r --arg id "$deployment_id" '.[] | select(.id == $id) | .status' | head -n 1)"
              echo "attempt=$attempt service=$service deployment=$deployment_id status=${status:-not_found}"
              case "$status" in
                SUCCESS)
                  return 0
                  ;;
                FAILED|CRASHED|REMOVED)
                  railway logs "$deployment_id" \
                    --project "$RAILWAY_PROJECT_ID" \
                    --environment "$RAILWAY_ENVIRONMENT" \
                    --service "$service" \
                    --deployment \
                    --lines 100 || true
                  return 1
                  ;;
              esac
              sleep 10
            done
            echo "::error::Timed out waiting for Railway deployment $deployment_id"
            return 1
          }
          wait_for_deployment "$RAILWAY_WEB_SERVICE_ID" "${{ steps.deploy_web.outputs.deployment_id }}"

      - name: Smoke test deployed site
        run: |
          curl --fail --silent --show-error "$RAILWAY_WEB_URL/" >/dev/null
          agent_manifest="$(curl --fail --silent --show-error "$RAILWAY_WEB_URL/.well-known/dydata-agent.json")"
          printf '%s' "$agent_manifest" | grep -Fq '"environment":"production"'
          printf '%s' "$agent_manifest" | grep -Fq "\"url\":\"${RAILWAY_WEB_URL%/}/mcp\""
          curl --fail --silent --show-error \
            "$RAILWAY_WEB_URL/.well-known/oauth-authorization-server" >/dev/null
          curl --fail --silent --show-error \
            "$RAILWAY_WEB_URL/.well-known/oauth-protected-resource/mcp" >/dev/null
          api_status="$(
            curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
              "$RAILWAY_WEB_URL/api/v1/auth/me"
          )"
          mcp_status="$(
            curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
              --request POST \
              --header "Content-Type: application/json" \
              --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
              "$RAILWAY_WEB_URL/mcp"
          )"
          if [ "$api_status" != "401" ]; then
            echo "::error::Expected unauthenticated API probe to return 401, got $api_status"
            exit 1
          fi
          if [ "$mcp_status" != "401" ]; then
            echo "::error::Expected unauthenticated MCP probe to return 401, got $mcp_status"
            exit 1
          fi
