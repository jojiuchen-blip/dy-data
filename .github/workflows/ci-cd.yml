name: DYDATA-102 scoped recovery operations

"on":
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: pg_rehearsal
        options:
          - pg_rehearsal
          - production_compact
          - production_recover_dry_run
          - production_recover_apply
          - production_scope_dry_run
          - production_scope_apply
        description: Explicit operation; default uses disposable PostgreSQL only

permissions:
  contents: read

jobs:
  scope-transaction:
    if: github.event.inputs.mode == 'pg_rehearsal' || github.event.inputs.mode == ''
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dydata_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dydata_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: ops
      - uses: actions/checkout@v4
        with:
          ref: 5effd6efcdf28f8d04d9f79b4ba7a38a13c3ecf9
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install application dependencies
        run: python -m pip install -r app/requirements.txt
      - name: Verify atomic visibility, rollback and replay on disposable PostgreSQL
        env:
          DY_RELEASE_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dydata_release
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/app:$GITHUB_WORKSPACE/app/apps/api:$GITHUB_WORKSPACE/app/tests"
          export DYDATA_OPS_SCOPE_SCRIPT="$GITHUB_WORKSPACE/ops/ops-preparation/september_scope_config.py"
          cd app
          python -m pytest "$GITHUB_WORKSPACE/ops/ops-preparation/test_scope_pg_acceptance.py" -q -p no:cacheprovider

  production-operation:
    if: startsWith(github.event.inputs.mode, 'production_')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: dydata102-production-operations
      cancel-in-progress: false
    env:
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_SSH_PORT: ${{ vars.TENCENT_SSH_PORT }}
      TENCENT_SSH_USER: ${{ vars.TENCENT_SSH_USER }}
      TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
      TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
      OPERATION: ${{ github.event.inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned SSH connection
        run: |
          set -euo pipefail
          for name in TENCENT_HOST TENCENT_SSH_USER TENCENT_SSH_KEY TENCENT_KNOWN_HOSTS; do
            [ -n "${!name}" ] || { echo "::error::missing $name"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent_lighthouse
          chmod 600 ~/.ssh/tencent_lighthouse
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$TENCENT_HOST" -f ~/.ssh/known_hosts >/dev/null
      - name: Execute the selected source-verified operation
        id: compact
        run: |
          set -euo pipefail
          case "$OPERATION" in
            production_compact)
              script=ops-preparation/production_compaction.sh
              payload=ops-preparation/compaction_snapshot.py
              destination=/tmp/dydata102-compaction-snapshot.py
              remote_command='bash -s'
              ;;
            production_recover_dry_run|production_recover_apply)
              script=ops-preparation/production_day_recovery.sh
              payload=ops-preparation/scoped_recovery_driver.py
              destination=/tmp/dydata102-scoped-recovery-driver.py
              if [ "$OPERATION" = production_recover_apply ]; then
                remote_command='bash -s -- apply'
              else
                remote_command='bash -s -- dry-run'
              fi
              ;;
            production_scope_dry_run|production_scope_apply)
              script=ops-preparation/production_scope.sh
              payload=ops-preparation/september_scope_config.py
              destination=/tmp/dydata102-september-scope-config.py
              if [ "$OPERATION" = production_scope_apply ]; then
                remote_command='bash -s -- apply'
              else
                remote_command='bash -s -- dry-run'
              fi
              ;;
            *) echo '::error::unsupported operation'; exit 2 ;;
          esac
          scp -i ~/.ssh/tencent_lighthouse -P "${TENCENT_SSH_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$payload" "$TENCENT_SSH_USER@$TENCENT_HOST:$destination"
          ssh -i ~/.ssh/tencent_lighthouse -p "${TENCENT_SSH_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=5 \
            "$TENCENT_SSH_USER@$TENCENT_HOST" "$remote_command" \
            < "$script" > "$RUNNER_TEMP/report.txt" 2>&1
          python3 ops-preparation/verify_operation_receipt.py "$OPERATION" "$RUNNER_TEMP/report.txt"
      - name: Validate masked aggregate report
        if: always() && steps.compact.outcome != 'skipped'
        id: report
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/report.txt"
          test -s "$report"
          if grep -Eqi 'BEGIN [A-Z ]*PRIVATE KEY|(Cookie|Authorization):[[:space:]]*[^ ]|postgres(ql)?(\+[a-z]+)?://[^@[:space:]]*:[^@*[:space:]]*@|eyJ[A-Za-z0-9_-]{10,}\.' "$report"; then
            echo "::error::credential-shaped report withheld"
            exit 1
          fi
          cat "$report"
      - uses: actions/upload-artifact@v4
        if: always() && steps.report.outcome == 'success'
        with:
          name: dydata102-controlled-operation-evidence
          path: ${{ runner.temp }}/report.txt
          retention-days: 14
