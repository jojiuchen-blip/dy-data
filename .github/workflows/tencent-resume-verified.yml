name: Resume verified Tencent deployment
"on":
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tencent-lighthouse-refs/heads/main
  cancel-in-progress: false
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: 9b1feb8598d685cfbf5fec7d18fa7b4fbe820864
      VERIFIED_RUN: '40432575545'
      GH_TOKEN: ${{ github.token }}
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_SSH_PORT: ${{ vars.TENCENT_SSH_PORT }}
      TENCENT_SSH_USER: ${{ vars.TENCENT_SSH_USER }}
      TENCENT_START_WORKER: ${{ vars.TENCENT_START_WORKER }}
      DY_WEB_BASE_URL: ${{ vars.DY_WEB_BASE_URL }}
      TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
      TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
    steps:
      - name: Verify immutable release evidence
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/runs/$VERIFIED_RUN > /tmp/run.json
          gh api repos/${{ github.repository }}/actions/runs/$VERIFIED_RUN/jobs > /tmp/jobs.json
          python - <<'PY'
          import json, os
          run = json.load(open('/tmp/run.json'))
          jobs = json.load(open('/tmp/jobs.json'))['jobs']
          assert run['head_sha'] == os.environ['TARGET_SHA']
          assert run['path'] == '.github/workflows/tencent-lighthouse-deploy.yml'
          assert run['event'] == 'workflow_dispatch'
          assert run['status'] == 'completed'
          assert any(j['name'] == 'Verify' and j['conclusion'] == 'success' for j in jobs)
          assert all(j['status'] == 'completed' for j in jobs)
          print('Full release verification passed for pinned target', run['head_sha'])
          PY
      - uses: actions/checkout@v4
        with:
          ref: 9b1feb8598d685cfbf5fec7d18fa7b4fbe820864
      - name: Configure bounded SSH keepalive
        run: |
          set -euo pipefail
          test "$TENCENT_START_WORKER" = true
          test -n "$DY_WEB_BASE_URL"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent_lighthouse
          chmod 600 ~/.ssh/tencent_lighthouse
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Preserve server source and resume verified deployment
        run: |
          set -euo pipefail
          git archive --format=tar "$TARGET_SHA" | gzip > /tmp/dy-resume-source.tar.gz
          archive_hash="$(sha256sum /tmp/dy-resume-source.tar.gz | cut -d' ' -f1)"
          archive="/tmp/dy-resume-${TARGET_SHA}-40437536727.tar.gz"
          remote_hash="$(ssh -i ~/.ssh/tencent_lighthouse -p "${TENCENT_SSH_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            "$TENCENT_SSH_USER@$TENCENT_HOST" "sha256sum '$archive'" | cut -d' ' -f1)"
          test "$remote_hash" = "$archive_hash"
          echo 'Previously uploaded immutable archive checksum verified'
          cat > /tmp/resume.sh <<'REMOTE'
          set -euo pipefail
          target="$1"
          archive="$2"
          web_url="$3"
          worker="$4"
          expected_hash="$5"
          test "$target" = 9b1feb8598d685cfbf5fec7d18fa7b4fbe820864
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$expected_hash"
          sudo -n true
          exec 9>/tmp/dy-verified-release.lock
          flock -n 9
          # Never overlap a deployment left running after transport failure.
          if pgrep -af '[b]ash deploy/tencent/deploy.sh' ; then
            echo 'Original deployment remains active; blocking duplicate deployment'
            exit 1
          fi
          df -h / /opt/dy-dashboard /var/lib/docker
          sudo docker system df
          sudo du -x -h --max-depth=1 /opt/dy-dashboard /opt/dy-dashboard/logs /tmp | sort -h
          sudo find /opt/dy-dashboard/logs/backups -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          echo 'Inspecting deployment state (no secrets)'
          if test -f /opt/dy-dashboard/logs/last-deploy.json; then
            sudo cat /opt/dy-dashboard/logs/last-deploy.json
          fi
          retention_script="$(mktemp /tmp/dy-release-retention.XXXXXX.py)"
          tar -xOf "$archive" scripts/backup_retention.py > "$retention_script"
          postgres_id="$(sudo docker ps -q --filter label=com.docker.compose.project=dy-dashboard --filter label=com.docker.compose.service=postgres)"
          [[ "$postgres_id" =~ ^[a-f0-9]{12,64}$ ]]
          sudo docker exec "$postgres_id" pg_restore --version
          sudo python3 "$retention_script" --backup-dir /opt/dy-dashboard/logs/backups \
            --validator-command "docker exec -i $postgres_id pg_restore" \
            --report-file /opt/dy-dashboard/logs/clue-release-retention-dry-run.json
          rm -f "$retention_script"
          exit 0
          # Stage and preserve the complete existing directory. Never recursively
          # delete a mixed-owner checkout, and do not relax its permissions.
          sudo python3 - "$archive" <<'PY'
          import os, pathlib, shutil, sys, tarfile, time
          root = pathlib.Path('/opt/dy-dashboard')
          app = root / 'repo'
          assert root.resolve() == root and app.resolve() == app
          assert app.is_dir() and not app.is_symlink()
          with tarfile.open(sys.argv[1], 'r:gz') as source:
              members = source.getmembers()
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert member.isfile() or member.isdir(), 'Unexpected archive member'
              reserve = sum(member.size for member in members)
              total, used, free = shutil.disk_usage(root)
              backups = list((root / 'logs' / 'backups').glob('pre-migrate-*.dump'))
              latest = max(backups, key=lambda p: p.stat().st_mtime) if backups else None
              backup_reserve = latest.stat().st_size * 1.5 if latest else 0
              print('Capacity evidence:', {'total': total, 'free': free, 'source_bytes': reserve, 'backup_reserve': backup_reserve, 'minimum_free': max(10 * 1024**3, total * .15)}, flush=True)
              assert free - reserve - backup_reserve >= max(10 * 1024**3, total * .15), 'Source staging capacity gate failed'
              stamp = time.strftime('%Y%m%dT%H%M%SZ', time.gmtime())
              stage = root / ('repo-stage-' + stamp)
              preserved = root / ('repo-preserved-' + stamp)
              assert not stage.exists() and not preserved.exists()
              stage.mkdir(mode=0o700)
              source.extractall(stage, members=members, filter='data')
          assert (stage / 'deploy/tencent/deploy.sh').is_file()
          assert (stage / 'apps/web/src/pages/ClueCenterPage.tsx').is_file()
          # Deployment commands run as the existing SSH user. Chown only the
          # newly staged trusted source, never existing business data or volumes.
          uid, gid = int(os.environ['SUDO_UID']), int(os.environ['SUDO_GID'])
          for parent, dirs, files in os.walk(stage):
              os.chown(parent, uid, gid)
              for name in files:
                  os.chown(pathlib.Path(parent) / name, uid, gid)
          app.rename(preserved)
          try:
              stage.rename(app)
          except BaseException:
              preserved.rename(app)
              raise
          print('Preserved previous source:', preserved)
          print('Source staging gate passed; free bytes before staging:', free)
          PY
          cd /opt/dy-dashboard/repo
          log="/opt/dy-dashboard/logs/release-resume-${target:0:8}-$(date -u +%Y%m%dT%H%M%SZ).log"
          echo "Resuming verified deployment; server log=$log"
          # Original script repeats backup, lineage, migration and all health gates.
          # Output also stays on server so interruption does not lose evidence.
          sudo env SKIP_GIT_SYNC=true DY_WEB_BASE_URL="$web_url" TENCENT_START_WORKER="$worker" \
            bash deploy/tencent/deploy.sh "$target" 2>&1 | sudo tee "$log"
          REMOTE
          ssh -i ~/.ssh/tencent_lighthouse -p "${TENCENT_SSH_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$TENCENT_SSH_USER@$TENCENT_HOST" \
            "bash -s -- '$TARGET_SHA' '$archive' '$DY_WEB_BASE_URL' '$TENCENT_START_WORKER' '$archive_hash'" < /tmp/resume.sh
