name: Inspect Tencent release capacity
"on":
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tencent-lighthouse-refs/heads/main
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_SSH_PORT: ${{ vars.TENCENT_SSH_PORT }}
      TENCENT_SSH_USER: ${{ vars.TENCENT_SSH_USER }}
      TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
      TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent_lighthouse
          chmod 600 ~/.ssh/tencent_lighthouse
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Read capacity evidence without changing services or files
        run: |
          set -euo pipefail
          cat > /tmp/inspect.sh <<'REMOTE'
          set -euo pipefail
          exec 9>/run/dy-dashboard-release.lock
          flock -n 9
          if pgrep -af '[b]ash deploy/tencent/deploy.sh'; then exit 1; fi
          df -B1 /opt/dy-dashboard /var/lib/docker
          du -x -B1 --max-depth=1 /opt/dy-dashboard /var/lib/docker /tmp | sort -n
          for directory in /var /var/lib /var/log; do du -x -B1 --max-depth=1 "$directory" | sort -n; done
          docker ps -a --size --format '{{.Names}} {{.Size}}'
          journalctl --disk-usage
          test "$(sha256sum /opt/dy-dashboard/repo/scripts/backup_retention.py | cut -d' ' -f1)" = "37ba64e65c5ccd92814588317e2a5def77fb5f52fdcc910bd3af153112c0ac6c"
          # Default dry-run; --apply is deliberately absent and the script hash is pinned.
          python3 /opt/dy-dashboard/repo/scripts/backup_retention.py --backup-dir /opt/dy-dashboard/logs/backups --validator-command 'docker exec -i dy-dashboard-postgres-1 pg_restore'
          docker system df
          du -x -B1 --max-depth=2 /opt/dy-dashboard/logs | sort -n
          docker image ls --no-trunc
          docker ps -a --format '{{.Names}} {{.Image}} {{.Status}}'
          docker ps -aq | xargs -r docker inspect --format '{{.Name}} {{.Image}}'
          find /opt/dy-dashboard/logs/backups -maxdepth 1 -type f -name 'images-*.manifest' -printf '%f %s\n' | sort
          find /opt/dy-dashboard/logs/backups -maxdepth 1 -type f -name 'pre-migrate-*.dump' -printf '%f %s\n' | sort
          if test -f /opt/dy-dashboard/logs/last-deploy.json; then cat /opt/dy-dashboard/logs/last-deploy.json; fi
          docker ps --format '{{.Names}} {{.Image}} {{.Status}}'
          REMOTE
          ssh -i ~/.ssh/tencent_lighthouse -p "${TENCENT_SSH_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "$TENCENT_SSH_USER@$TENCENT_HOST" 'sudo -n bash -s' < /tmp/inspect.sh





