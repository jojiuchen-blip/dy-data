name: Read DYDATA-121 production evidence
"on":
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      TARGET_SHA: dd55cc737c19792f97bfc8b2c6f32190a2a11405
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_SSH_PORT: ${{ vars.TENCENT_SSH_PORT }}
      TENCENT_SSH_USER: ${{ vars.TENCENT_SSH_USER }}
      TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
      TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
    steps:
      - name: Check production scope coverage and routing counts
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent_lighthouse
          chmod 600 ~/.ssh/tencent_lighthouse
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/tencent_lighthouse -p "${TENCENT_SSH_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=25 -o ServerAliveCountMax=6 \
            "$TENCENT_SSH_USER@$TENCENT_HOST" "sudo -n bash -s -- '$TARGET_SHA'" <<'REMOTE'
          set -euo pipefail
          target="$1"
          receipt=/opt/dy-dashboard/logs/last-deploy.json
          check_receipt() {
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["sha"]==sys.argv[2] and d["environment"]=="production"; print("production_release_receipt",d["ts"],d["sha"])' "$receipt" "$target"
          }
          check_receipt
          cd /opt/dy-dashboard/repo
          pg_read() {
            DY_WEB_BASE_URL=https://dy-business-engine.com docker compose \
              --env-file /opt/dy-dashboard/env/production.env -f deploy/compose.yaml exec -T postgres \
              sh -c 'exec psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At'
          }
          for attempt in $(seq 1 12); do
            status="$(pg_read <<'SQL'
          SELECT COALESCE((SELECT status FROM job_runs WHERE job_name='clue_routing_store_sync'
            AND metadata_json->'catalogue_outcomes' IS NOT NULL ORDER BY started_at DESC LIMIT 1), 'waiting');
          SQL
            )"
            if [ "$status" = success ] || [ "$status" = failed ]; then break; fi
            if [ "$attempt" = 12 ]; then break; fi
            sleep 45
          done
          pg_read <<'SQL'
          BEGIN READ ONLY;
          SELECT 'alembic_revision', version_num FROM alembic_version;
          SELECT 'routing', c.store_list_source, count(DISTINCT c.product_id), count(m.store_id)
            FROM clue_product_routing_configs c LEFT JOIN clue_product_store_list_members m
              ON m.list_version_id=c.active_list_version_id WHERE c.routing_enabled GROUP BY c.store_list_source;
          WITH jingcheng AS (
            SELECT product_id FROM dim_sku_product_rules WHERE product_scope='精诚养车'
            UNION SELECT sku_id FROM dim_sku_product_rules WHERE product_scope='精诚养车'
          )
          SELECT 'catalogue', CASE WHEN EXISTS (SELECT FROM jingcheng j WHERE j.product_id = s.product_id)
             THEN 'jingcheng' ELSE 'byd' END AS product_scope,
             s.status, count(*), coalesce(sum(s.store_count),0)
            FROM clue_product_douyin_store_scopes s GROUP BY 2,3 ORDER BY 2,3;
          SELECT 'daily_job', job_id, status, success_count, failed_count, coalesce(metadata_json::text, '{}')
            FROM job_runs WHERE job_name='clue_routing_store_sync' ORDER BY started_at DESC LIMIT 1;
          COMMIT;
          SQL
          check_receipt
          REMOTE
