name: Resume verified Tencent deployment
"on":
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tencent-lighthouse-refs/heads/main
  cancel-in-progress: false
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: 9b1feb8598d685cfbf5fec7d18fa7b4fbe820864
      VERIFIED_RUN: '40432575545'
      GH_TOKEN: ${{ github.token }}
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_SSH_PORT: ${{ vars.TENCENT_SSH_PORT }}
      TENCENT_SSH_USER: ${{ vars.TENCENT_SSH_USER }}
      TENCENT_START_WORKER: ${{ vars.TENCENT_START_WORKER }}
      DY_WEB_BASE_URL: ${{ vars.DY_WEB_BASE_URL }}
      TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
      TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
    steps:
      - name: Verify immutable release evidence
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/runs/$VERIFIED_RUN > /tmp/run.json
          gh api repos/${{ github.repository }}/actions/runs/$VERIFIED_RUN/jobs > /tmp/jobs.json
          python - <<'PY'
          import json, os
          run = json.load(open('/tmp/run.json'))
          jobs = json.load(open('/tmp/jobs.json'))['jobs']
          assert run['head_sha'] == os.environ['TARGET_SHA']
          assert run['path'] == '.github/workflows/tencent-lighthouse-deploy.yml'
          assert run['event'] == 'workflow_dispatch'
          assert run['status'] == 'completed'
          assert any(j['name'] == 'Verify' and j['conclusion'] == 'success' for j in jobs)
          assert all(j['status'] == 'completed' for j in jobs)
          print('Full release verification passed for pinned target', run['head_sha'])
          PY
      - uses: actions/checkout@v4
        with:
          ref: 9b1feb8598d685cfbf5fec7d18fa7b4fbe820864
      - name: Configure bounded SSH keepalive
        run: |
          set -euo pipefail
          test "$TENCENT_START_WORKER" = true
          test -n "$DY_WEB_BASE_URL"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent_lighthouse
          chmod 600 ~/.ssh/tencent_lighthouse
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Preserve server source and resume verified deployment
        run: |
          set -euo pipefail
          git archive --format=tar "$TARGET_SHA" | gzip > /tmp/dy-resume-source.tar.gz
          archive_hash="$(sha256sum /tmp/dy-resume-source.tar.gz | cut -d' ' -f1)"
          archive="/tmp/dy-resume-${TARGET_SHA}-40437536727.tar.gz"
          remote_hash="$(ssh -i ~/.ssh/tencent_lighthouse -p "${TENCENT_SSH_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            "$TENCENT_SSH_USER@$TENCENT_HOST" "sha256sum '$archive'" | cut -d' ' -f1)"
          test "$remote_hash" = "$archive_hash"
          echo 'Previously uploaded immutable archive checksum verified'
          cat > /tmp/resume.sh <<'REMOTE'
          set -euo pipefail
          target="$1"
          archive="$2"
          web_url="$3"
          worker="$4"
          expected_hash="$5"
          test "$target" = 9b1feb8598d685cfbf5fec7d18fa7b4fbe820864
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$expected_hash"
          sudo -n true
          exec 9>/tmp/dy-verified-release.lock
          flock -n 9
          # Never overlap a deployment left running after transport failure.
          if pgrep -af '[b]ash deploy/tencent/deploy.sh' ; then
            echo 'Original deployment remains active; blocking duplicate deployment'
            exit 1
          fi
          cd /opt/dy-dashboard/repo
          sudo python3 - <<'CLEAN'
          import json, pathlib, shutil, subprocess, time
          def command(*args):
              return subprocess.check_output(['docker', *args], text=True)
          obsolete = 'sha256:658e9b66da9c97d2ebe7936d47e4e972bfd66ea538f2ceaf9acd8e57df579e3e'
          tags = {
              'dy-dashboard-rollback:20261022T134247Z-browser',
              'dy-dashboard-rollback:20261022T140618Z-browser',
              'dy-dashboard-browser:candidate-56-e4bdea3b',
              'dy-dashboard-browser:release-104-7b54b97cac49',
              'dy-dashboard-browser:release-104-ade0ab1071e9',
          }
          ids = command('ps', '-aq').split()
          protected = {row['Image'] for row in json.loads(command('inspect', *ids))}
          for stamp in ('20261027T025005Z', '20261023T132349Z'):
              for line in pathlib.Path('/opt/dy-dashboard/logs/backups/images-' + stamp + '.manifest').read_text().splitlines():
                  if not line.startswith('#') and len(line.split('|')) == 5:
                      image = line.split('|')[2]
                      if image.startswith('sha256:'): protected.add(image)
          for ref in ('dy-dashboard-api:release-105-ca61eff46773', 'dy-dashboard-worker:release-105-ca61eff46773', 'dy-dashboard-web:release-105-ca61eff46773', 'dy-dashboard-browser:release-105-ca61eff46773-permissions', 'dy-dashboard-ops-agent:release-105-ca61eff46773'):
              protected.add(json.loads(command('image', 'inspect', ref))[0]['Id'])
          assert obsolete not in protected
          for path in [pathlib.Path('/opt/dy-dashboard/env/production.env'), *pathlib.Path('/opt/dy-dashboard/deploy-overrides').glob('*')]:
              if path.is_file():
                  content = path.read_text()
                  assert obsolete not in content and not any(tag in content for tag in tags), 'Image remains configured'
          # The preceding run removed exactly the audited obsolete image, then
          # discovered pre-existing missing images on long-exited containers.
          # Those three IDs were absent in the read-only inventory before cleanup.
          legacy_missing = {
              'sha256:c894a507fc37e5a73b14ea247323352cf9cb8de2c71a333e8bfddf900e8c414d',
              'sha256:f3247d8bb1ca8df97966aaf92cd90505530aa13a218cc97db28611f707e58669',
              'sha256:e8acfab75f241599ac484fabf0be6accbc7d73fb17a1beddc351ce98cf6349be',
          }
          running = command('ps', '-q').split()
          assert not ({row['Image'] for row in json.loads(command('inspect', *running))} & legacy_missing)
          report = max(pathlib.Path('/opt/dy-dashboard/logs').glob('image-retention-clue-*.json'), key=lambda path: path.stat().st_mtime)
          evidence = json.loads(report.read_text())
          assert evidence['image'] == obsolete and set(evidence['tags']) == tags
          result = subprocess.run(['docker', 'image', 'inspect', obsolete], capture_output=True)
          assert result.returncode != 0 and b'No such image' in result.stderr
          for image in protected - legacy_missing: command('image', 'inspect', image)
          evidence['preexisting_missing_stopped_container_images'] = sorted(legacy_missing)
          evidence.update(phase='complete', free_after=shutil.disk_usage('/opt/dy-dashboard').free)
          report.write_text(json.dumps(evidence))
          print('Exact obsolete image cleanup:', json.dumps(evidence))
          CLEAN
          cutover="$(sudo python3 - "$archive" <<'PY'
          import hashlib, os, pathlib, shutil, sys, tarfile, tempfile
          root = pathlib.Path('/opt/dy-dashboard/repo')
          assert root.resolve() == root
          total, used, free = shutil.disk_usage(root)
          assert free >= max(10 * 1024**3, total * .15), 'Cutover capacity gate failed'
          with tarfile.open(sys.argv[1], 'r:gz') as archive:
              for member in archive.getmembers():
                  if member.isfile():
                      path = pathlib.PurePosixPath(member.name)
                      assert not path.is_absolute() and '..' not in path.parts
                      actual = root / member.name
                      assert actual.is_file() and not actual.is_symlink(), member.name
                      assert hashlib.sha256(actual.read_bytes()).digest() == hashlib.sha256(archive.extractfile(member).read()).digest(), member.name
          source = (root / 'deploy/tencent/deploy.sh').read_text()
          prefix = source.split('trap on_error ERR', 1)[0]
          tail = source[source.index('log "starting independent publication worker before API replacement"'):]
          gate = r'''trap on_error ERR
          cd "$APP_DIR"
          test "$START_WORKER" = true
          validate_compose_config
          backup_running_images
          check_production_migration_lineage
          compose run --rm --no-deps migrate python -c 'from alembic.config import Config; from alembic.script import ScriptDirectory; from sqlalchemy import text; from apps.api.dy_api.db import get_session_factory; s=get_session_factory()(); assert s.execute(text("select version_num from alembic_version")).scalar_one() == ScriptDirectory.from_config(Config("alembic.ini")).get_current_head(); s.close()'
          validate_backup_path /opt/dy-dashboard/logs/backups/pre-migrate-20261027T025642Z.dump
          # Verify built application images against the already verified source.
          for service in api worker; do
            for file in apps/api/dy_api/routes/_data.py apps/worker/clue_center.py; do
              expected="$(sha256sum "$file" | cut -d' ' -f1)"
              actual="$(compose run --rm --no-deps "$service" sha256sum "/app/$file" | cut -d' ' -f1)"
              test "$actual" = "$expected"
            done
          done
          compose run --rm --no-deps web sh -c 'grep -l "核销门店暂缺" /usr/share/nginx/html/assets/ClueCenterPage-*.js'
          # Retain all readiness gates. Retry only this consistency phase; no
          # forced publication, new database dump, or duplicate image build.
          ready=false
          for attempt in 1 2 3; do
            if warm_dashboard_publications; then ready=true; break; fi
            log "publication consistency retry=$attempt"
            sleep 10
          done
          test "$ready" = true
          '''
          # Reuse the original snapshot-exception gate unchanged.
          exceptions = source[source.index('log "checking unresolved statement snapshot migration exceptions"'):source.index('# Do not replace the old API')]
          gate = gate.replace('ready=false', exceptions + '\nready=false', 1)
          handle, name = tempfile.mkstemp(prefix='dy-clue-cutover-', suffix='.sh')
          with os.fdopen(handle, 'w') as out:
              out.write(prefix + gate + '\n' + tail)
          print(name)
          PY
          )"
          log="/opt/dy-dashboard/logs/clue-cutover-$(date -u +%Y%m%dT%H%M%SZ).log"
          sudo env SKIP_GIT_SYNC=true DY_WEB_BASE_URL="$web_url" TENCENT_START_WORKER="$worker" \
            bash "$cutover" "$target" 2>&1 | sudo tee "$log"
          REMOTE
          ssh -i ~/.ssh/tencent_lighthouse -p "${TENCENT_SSH_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$TENCENT_SSH_USER@$TENCENT_HOST" \
            "bash -s -- '$TARGET_SHA' '$archive' '$DY_WEB_BASE_URL' '$TENCENT_START_WORKER' '$archive_hash'" < /tmp/resume.sh
